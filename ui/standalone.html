            /* 贴边：任何 token 距边界 < 6px 记一笔，攒久了画面很挤 */
            var tight = 0;
            toks.forEach(function (el) {
              var r = el.getBoundingClientRect();
              if (r.left - box.left < 6 || box.right - r.right < 6) tight++;
            });
            if (tight && tight >= Math.min(4, toks.length)) out.边缘挤压.push(lay.key + '@' + li + ' 贴边 ' + tight + ' 字 [seed ' + sd + ']' + F);

            /* 入场跑不完本段：拿基准登场件（升起）重算一次配牌（不碰 DOM），
             * 看引擎把 stagger 收完之后还有多长——收不下的才是真问题。 */
            var tp = PV.planLine(li, {
              keepCuts: true, cutI: ci, layout: lay.key, face: PINFACE, look: 'none', bg: 'solid',
              enter: 'rise', hold: 'none', exit: 'none', transition: 'cut', camera: 'none',
              decor: [], treatment: []
            });
            /* 时间不能只测 rise：⑫ 一下多了 12 件登场，只测默认那件就等于
             * 新件的时长没人管。登场的 dur/staggerOf 都在件上声明，
             * 这里不碰 DOM，拿同一套算式逐件算一遍——错了就是真错，不是量具错。*/
            var es = opts.eachEnter === false ? [PV.part('enter', 'rise')] : PV.parts('enter');
            es.forEach(function (ep) {
              if (!ep) return;
              var ectx = tp ? tp.ctx : null;
              var cost = enterCost(ep, ectx);
              if (cost > avail * 0.9) {
                out.入场超时.push(lay.key + '@' + li + ' 入场[' + ep.key + '] ' +
                  Math.round(cost) + 'ms，本段 ' + Math.round(avail) + 'ms（阈值 90%）[seed ' + sd + ']' + F);
              }
              /* tempo 收到 0.45 以下，字几乎同时出来——逐字入场已经没了。
               * 超时那项现在由引擎保证（收完必然落在预算里），能看出问题的反而是这个数。*/
              if (ectx && ectx.tempo != null && ectx.tempo < 0.45) {
                out.入场挤压.push(lay.key + '@' + li + ' 入场[' + ep.key + '] tempo=' +
                  ectx.tempo.toFixed(2) + '，' + (ectx.tokens ? ectx.tokens.length : '?') + ' 字挤在 ' +
                  Math.round(avail) + 'ms 里 [seed ' + sd + ']' + F);
              }
            });
            var cost = tp ? enterCost(tp.enter, tp.ctx) : 0;
            void cost;   /* 上面逐件算过了，这里不再单独报 rise，免得同一件事记两笔 */
          });
        }
      }
    }
    try {
      if (opts.eachFace) PV.parts('face').forEach(function (f) { pass(f.key); });
      else pass(opts.face || 'hei');
    } finally {
      PV.faceManual = saved.manual;
      if (saved.style && PV.useStyle) PV.useStyle(saved.style);
      /* 先恢复气氛（setMood 会把 fx 刷成该气氛的预设），再把 fx 精确贴回体检前的值 */
      if (saved.mood) PV.setMood(saved.mood);
      Object.assign(PV.fx, saved.fx);
      PV.setLyrics(L);
      if (keepIdx >= 0) PV.show(keepIdx, { force: true });
    }
    out.跳过 = skipped;
    out.可达组合 = out.可达组合 || (21 - 2) * lines.length;
    if (opts.quiet) {
      return {
        溢出: out.溢出.length, 入场超时: out.入场超时.length,
        空段: out.空段.length, 边缘挤压: out.边缘挤压.length
      };
    }
    return out;
  };
})();

/* PV 引擎 · 19 背景层（⑧）
 *
 * JIZURA 的背景是 66 件、逐段重掷的，我们之前整块底只有一个风格纯色——
 * 这就是「只有那一排在动」的根因。补一个 bg 层：每段按概率换，图样自己带强度，
 * 由 fx.texture / fx.density / energy 推着走。
 *
 * 三条规矩：
 *  · 一律挂在 #pvJv 上（在 .jv-track 之下、 folia 的 .pv-bg 之上），inset:0、不吃交互。
 *  · 换不换由 PV.bgSwap 管（0=跟着风格走，1=每段都换）。段段换会眼晕，
 *    JIZURA 自己也是「頻度」滑块而不是恒定切换。
 *  · 只建一个宿主层反复换样式，不按段往 DOM 里堆节点——粒子那种「一层用到老」是有意为之。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.bgSwap = 0.45;         // 每段换背景的概率
  PV.defaults.bg = 'solid';
  if (PV.rolling) PV.rolling.bg = true;

  var host = null;
  function bgHost() {
    var L = PV.layer();
    if (!L) return null;
    if (!host || !host.isConnected) {
      host = L.querySelector('.jv-bg-layer');
      if (!host) {
        host = document.createElement('div');
        host.className = 'jv-bg-layer';
        L.insertBefore(host, L.firstChild);      // 永远在最底下
      }
    }
    return host;
  }
  PV.bgHost = bgHost;

  function put(el, props) {
    if (!el) return;
    for (var k in props) if (props[k] == null) el.style.removeProperty(k); else el.style.setProperty(k, props[k]);
  }

  /* ---------- 12 件背景 ---------- */
  PV.reg('bg', 'solid', {
    nm: '纯色', w: 1.2, tags: ['calm', 'editorial', 'pop', 'graphic', 'emotional', 'glitch', 'horror'],
    apply: function (c) { put(bgHost(), { background: '', 'background-image': '' }); }
  });

  PV.reg('bg', 'duo', {
    nm: '双色', w: 1, tags: ['pop', 'emotional', 'calm', 'graphic'],
    apply: function (c) {
      var st = c.style || {}, ang = Math.round(PV.rnd(360));
      var a = st.sub || 'color-mix(in srgb,var(--jv-bg) 78%, var(--jv-acc))';
      put(bgHost(), { 'background-image': 'linear-gradient(' + ang + 'deg, transparent, ' + a + ' 130%)' });
    }
  });

  PV.reg('bg', 'vig', {
    nm: '晕影', w: 0.9, tags: ['calm', 'emotional', 'editorial', 'horror'],
    apply: function () {
      put(bgHost(), {
        'background-image': 'radial-gradient(120% 92% at 50% 42%, transparent 34%, rgba(0,0,0,.55) 100%)'
      });
    }
  });

  PV.reg('bg', 'grid', {
    nm: '网格', w: 0.9, tags: ['graphic', 'editorial', 'glitch'],
    apply: function (c) {
      var g = bgHost(), s = Math.round(26 + PV.fx.density * 34);
      put(g, {
        'background-image': 'linear-gradient(to right, color-mix(in srgb,var(--jv-fg) 16%, transparent) 1px, transparent 1px),' +
          'linear-gradient(to bottom, color-mix(in srgb,var(--jv-fg) 16%, transparent) 1px, transparent 1px)',
        'background-size': s + 'px ' + s + 'px'
      });
      g.style.opacity = String(0.1 + 0.35 * PV.fx.texture);
    }
  });

  PV.reg('bg', 'stripes', {
    nm: '斜纹', w: 0.8, tags: ['pop', 'graphic'],
    apply: function () {
      var st = Math.round(10 + PV.rnd(26));
      put(bgHost(), {
        'background-image': 'repeating-linear-gradient(' + (100 + Math.round(PV.rnd(40))) + 'deg, color-mix(in srgb,var(--jv-acc) 26%, transparent) 0 2px, transparent 2px ' + st + 'px)',
        opacity: '0.2'
      });
    }
  });

  PV.reg('bg', 'blocks', {
    nm: '色块', w: 0.7, tags: ['pop', 'graphic', 'editorial'],
    apply: function () {
      var n = 3 + Math.round(PV.rnd(2)), ls = [];
      for (var i = 0; i < n; i++) {
        var x = Math.round(PV.rnd(100)), y = Math.round(PV.rnd(100)), r = 12 + Math.round(PV.rnd(30));
        ls.push('radial-gradient(' + r + '% ' + r + '% at ' + x + '% ' + y + '%, color-mix(in srgb,var(--jv-acc) 22%, transparent), transparent 70%)');
      }
      put(bgHost(), { 'background-image': ls.join(','), opacity: '0.75' });
    }
  });

  PV.reg('bg', 'beam', {
    nm: '扫光', w: 0.7, tags: ['emotional', 'pop', 'calm'],
    apply: function () {
      var el = bgHost();
      put(el, {
        'background-image': 'linear-gradient(105deg, transparent 42%, color-mix(in srgb,var(--jv-fg) 14%, transparent) 50%, transparent 58%)',
        animation: 'jvBgBeam ' + (9 + Math.round(PV.rnd(9))) + 's linear infinite', opacity: ''
      });
    }
  });

  PV.reg('bg', 'rings', {
    nm: '同心圈', w: 0.7, tags: ['graphic', 'glitch', 'editorial'],
    apply: function () {
      put(bgHost(), {
        'background-image': 'repeating-radial-gradient(circle at 50% 50%, transparent 0 42px, color-mix(in srgb,var(--jv-acc) 14%, transparent) 42px 43px)',
        animation: 'jvBgZoom ' + (16 + Math.round(PV.rnd(10))) + 's ease-in-out infinite alternate', opacity: '.9'
      });
    }
  });

  PV.reg('bg', 'scan', {
    nm: '扫描线', w: 0.7, tags: ['glitch', 'horror', 'graphic'],
    when: function () { return PV.fx.texture > 0.15; },
    apply: function () {
      put(bgHost(), {
        'background-image': 'repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 4px)',
        animation: 'jvBgScan 7s linear infinite', opacity: String(0.14 + 0.4 * PV.fx.texture)
      });
    }
  });

  PV.reg('bg', 'dust', {
    nm: '浮尘', w: 0.7, tags: ['calm', 'emotional'],
    when: function () { return PV.fx.texture > 0.18; },
    apply: function () {
      put(bgHost(), {
        'background-image': 'radial-gradient(circle, color-mix(in srgb,var(--jv-fg) 30%, transparent) 1px, transparent 1.6px)',
        'background-size': '34px 34px, 57px 57px',
        animation: 'jvBgDrift 26s linear infinite', opacity: String(0.1 + 0.3 * PV.fx.texture)
      });
    }
  });

  PV.reg('bg', 'hue', {
    nm: '偏色', w: 0.6, tags: ['pop', 'glitch', 'emotional'],
    when: function () { return PV.fx.chroma > 0.3; },
    apply: function () {
      put(bgHost(), {
        'background-image': 'linear-gradient(160deg, color-mix(in srgb,var(--jv-acc) 30%, #0ff 30%), transparent 55%, color-mix(in srgb,var(--jv-acc) 26%, #f08 30%))',
        mixBlendMode: 'soft-light', animation: 'jvBgHue 12s linear infinite', opacity: String(0.35 + 0.5 * PV.fx.chroma)
      });
    }
  });

  /* 能量驱动的一层：没有音频数据时 when 不成立，抽不到 */
  PV.reg('bg', 'pulse', {
    nm: '能量底', w: 0.9, tags: ['pop', 'glitch', 'graphic'],
    when: function () { return PV.audio.energy != null; },
    apply: function () {
      var el = bgHost();
      if (!el) return null;
      el.style.setProperty('background-image', 'radial-gradient(120% 90% at 50% 60%, color-mix(in srgb,var(--jv-acc) 30%, transparent), transparent 62%)');
      el.style.mixBlendMode = 'screen';
      var fr = function () {
        var e = PV.audio.energy || 0, b = PV.audio.beat;
        var k = e * 0.55 + (b ? Math.max(0, 1 - b.since / (b.len * 0.6)) * 0.45 : 0);
        el.style.opacity = (0.05 + 0.5 * Math.min(1, k)).toFixed(3);
      };
      fr();
      PV.onFrame(fr);
      return function () { PV.offFrame(fr); el.style.mixBlendMode = ''; };
    }
  });

  /* ---------- 选与用 ---------- */
  var cur = null;
  PV.bgKey = function () { return cur; };

  PV.rollBg = function (ctx, opts) {
    if (opts.bg) return PV.part('bg', opts.bg) || PV.part('bg', PV.defaults.bg);
    if (PV.bgSwap <= 0) return cur ? PV.part('bg', cur) : PV.part('bg', PV.defaults.bg);
    if (cur && PV.rnd(1) > PV.bgSwap) return PV.part('bg', cur);   // 不换就沿用上件
    /* 决定换了就不再抽回同一件——否则「换率 0.45」实际只跑出 0.33，旋钮说的不算 */
    var b = PV.choose('bg', ctx, opts);
    for (var i = 0; i < 3 && b && cur && b.key === cur; i++) b = PV.choose('bg', ctx, opts);
    return b || PV.part('bg', 'solid');
  };

  PV.useBg = function (b, ctx) {
    if (typeof b === 'string') b = PV.part('bg', b);
    if (!b) b = PV.part('bg', PV.defaults.bg);
    if (!b) return null;
    cur = b.key;
    var el = bgHost();
    if (!el) return b;
    /* 换件前抹掉上一件留下的样式，否则 background-image / animation 会串台。
     * 清单要盖全：⑮ 加了带 mask / blend / position 的件后，这几个不在表里就会渗到下一段
     * （实测 9 件背景换到纯色后 mask 还在，整块底被遮得只余一角）。*/
    ['background-image', 'background-size', 'background-position', 'background',
     'animation', 'opacity', 'mix-blend-mode', 'filter',
     'mask-image', '-webkit-mask-image', 'mask-size', 'mask-position'].forEach(function (k) {
      el.style.removeProperty(k);
    });
    el.dataset.bg = b.key;
    if (b.apply) return b.apply(ctx || {}, el);
    return null;
  };
})();

/* PV 引擎 · 21 字形外观层（⑩ look）
 *
 * 吸收自 JIZURA 的 11p_looks.js——先纠正一句我上一轮说错的话：那个包是**混合包**，
 * 85 条里前 24 条才是真「字形外观」（袋文字/立体/傍点/マーカー…），后面混着背景、
 * 镜头、转场、后处理。而那 24 条对应的能力，我们**一件都没有**——133 件里没有一个
 * 改变文字本身涂装的层。所以这层是补空白，不是扩量。
 *
 * 归属规矩（比件数重要）：本层只写**涂装**——text-shadow / -webkit-text-stroke /
 * background-clip / text-decoration / text-emphasis / font-style / color，
 * 全部通过 .pv-jv[data-look=…] 作用在 `i.jv-t` 上。
 * 不碰 transform（归版式与镜头）、不碰 left/top 与 --fx/--fy/--fk（归守卫）、
 * 不碰 --drift-*（归保持层）。所以外观能和呼吸、拍震、守卫叠加而谁也不盖谁。
 *
 * vars 可以是对象，也可以是函数(ctx) —— 函数版让每件在自己那段里掷幅度，
 * 同一个件每段看起来不至于像一个模子。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.defaults.look = 'none';
  if (PV.rolling) PV.rolling.look = true;

  function rnd(a, b, unit) { return (a + PV.rnd(b - a)).toFixed(1) + (unit || ''); }

  PV.reg('look', 'none', { nm: '无', w: 1.5, tags: ['calm', 'editorial', 'pop', 'graphic', 'emotional', 'glitch', 'horror'] });

  /* ---------- 描边族 ---------- */
  PV.reg('look', 'outline', {
    nm: '袋文字', w: 1, tags: ['pop', 'graphic'],
    vars: function () { return { '--lk-sw': rnd(0.035, 0.07, 'em') }; }
  });
  PV.reg('look', 'outlineFill', {
    nm: '缘取', w: 1, tags: ['pop', 'graphic', 'emotional'],
    vars: function () { return { '--lk-sw': rnd(0.04, 0.08, 'em'), '--lk-fill': 'var(--jv-fg)' }; }
  });
  PV.reg('look', 'doubleOutline', {
    nm: '二重缘', w: 0.7, tags: ['graphic', 'glitch'],
    vars: function () { return { '--lk-sw': rnd(0.04, 0.065, 'em'), '--lk-ring': rnd(2, 5, 'px') }; }
  });
  PV.reg('look', 'dotted', {
    nm: '点线缘', w: 0.55, tags: ['editorial', 'graphic'],
    when: function () { return PV.fx.texture > 0.2; },
    vars: function () { return { '--lk-sw': rnd(0.05, 0.08, 'em'), '--lk-dash': rnd(3, 6, 'px') }; }
  });
  PV.reg('look', 'echoOutline', {
    nm: '轮廓回响', w: 0.6, tags: ['emotional', 'glitch'],
    vars: function () { return { '--lk-sw': rnd(0.03, 0.05, 'em'), '--lk-echo': rnd(6, 14, 'px') }; }
  });

  /* ---------- 阴影族 ---------- */
  PV.reg('look', 'extrude', {
    nm: '立体', w: 0.9, tags: ['pop', 'graphic'],
    vars: function () {
      var a = (120 + PV.rnd(120)) * Math.PI / 180;                 // 光从左上，影子往右下
      return { '--lk-dx': Math.cos(a).toFixed(3), '--lk-dy': Math.abs(Math.sin(a)).toFixed(3), '--lk-n': 7 };
    }
  });
  PV.reg('look', 'longShadow', {
    nm: '长影', w: 0.7, tags: ['graphic', 'pop', 'horror'],
    vars: function () {
      var a = (110 + PV.rnd(130)) * Math.PI / 180, k = 0.9 + PV.rnd(0.6);
      return { '--lk-dx': (Math.cos(a) * k).toFixed(3), '--lk-dy': (Math.sin(a) * k).toFixed(3), '--lk-n': 14 };
    }
  });
  PV.reg('look', 'hardShadow', {
    nm: '偏移影', w: 0.9, tags: ['graphic', 'pop', 'glitch'],
    vars: function () {
      var a = (100 + PV.rnd(160)) * Math.PI / 180, k = 2 + PV.rnd(4);
      return { '--lk-dx': (Math.cos(a) * k).toFixed(2), '--lk-dy': (Math.sin(a) * k).toFixed(2) };
    }
  });
  PV.reg('look', 'softShadow', {
    nm: '柔影', w: 0.9, tags: ['calm', 'emotional'],
    vars: function () { return { '--lk-soft': rnd(0.3, 0.7, 'em') }; }
  });
  PV.reg('look', 'glow', {
    nm: '发光', w: 0.8, tags: ['emotional', 'pop'],
    when: function () { return PV.fx.chroma > 0.2; },
    vars: function () { return { '--lk-glow': rnd(0.4, 1.1, 'em') }; }
  });

  /* ---------- 填充族（background-clip:text） ---------- */
  PV.reg('look', 'gradientV', {
    nm: '纵向渐变', w: 0.9, tags: ['emotional', 'pop', 'graphic'],
    vars: function () { return { '--lk-clip': '1', '--lk-dir': Math.round(rnd(120, 240)) + 'deg' }; }
  });
  PV.reg('look', 'splitColor', {
    nm: '上下二色', w: 0.75, tags: ['graphic', 'pop'],
    vars: function () { return { '--lk-clip': '1', '--lk-stop': Math.round(38 + PV.rnd(24)) + '%' }; }
  });
  PV.reg('look', 'halftone', {
    nm: '网点', w: 0.6, tags: ['graphic', 'glitch', 'pop'],
    when: function () { return PV.fx.texture > 0.25; },
    vars: function () { return { '--lk-clip': '1', '--lk-dot': rnd(3, 7, 'px') }; }
  });
  PV.reg('look', 'stripes', {
    nm: '条纹填充', w: 0.6, tags: ['graphic', 'pop'],
    when: function () { return PV.fx.texture > 0.2; },
    vars: function () { return { '--lk-clip': '1', '--lk-pitch': rnd(4, 9, 'px'), '--lk-ang': Math.round(rnd(60, 130)) + 'deg' }; }
  });
  PV.reg('look', 'hatch', {
    nm: '斜线填充', w: 0.5, tags: ['editorial', 'graphic'],
    when: function () { return PV.fx.texture > 0.3; },
    vars: function () { return { '--lk-clip': '1', '--lk-pitch': rnd(2, 4.5, 'px') }; }
  });
  PV.reg('look', 'marker', {
    nm: '荧光标记', w: 0.8, tags: ['editorial', 'pop'],
    vars: function () { return { '--lk-mk': rnd(58, 86) + '%' }; }
  });

  /* ---------- 线与框族 ---------- */
  PV.reg('look', 'underline', {
    nm: '下划线', w: 0.8, tags: ['editorial', 'calm'],
    vars: function () { return { '--lk-ul': rnd(2, 5, 'px') }; }
  });
  PV.reg('look', 'strike', { nm: '删除线', w: 0.45, tags: ['editorial', 'glitch'] });
  PV.reg('look', 'boxed', {
    nm: '箱组', w: 0.7, tags: ['graphic', 'pop', 'editorial'],
    vars: function () { return { '--lk-pad': rnd(2, 8, 'px'), '--lk-bw': rnd(1, 2.5, 'px') }; }
  });
  PV.reg('look', 'emphasisDots', { nm: '傍点', w: 0.7, tags: ['emotional', 'editorial', 'calm'] });
  PV.reg('look', 'alternate', { nm: '交互色', w: 0.6, tags: ['pop', 'graphic'] });
  PV.reg('look', 'italic', { nm: '斜体', w: 0.7, tags: ['emotional', 'editorial'] });
  PV.reg('look', 'stencil', {
    nm: '镂空', w: 0.45, tags: ['glitch', 'horror', 'graphic'],
    when: function () { return PV.fx.glitch > 0.3; },
    vars: function () { return { '--lk-clip': '1', '--lk-sw': rnd(0.03, 0.05, 'em'), '--lk-bar': rnd(6, 14, 'px') }; }
  });

  /* ---------- 挂接：一层一件，只写 vars 与 data-look ---------- */
  var applied = [];

  function clearVars(el) {
    applied.forEach(function (k) { el.style.removeProperty(k); });
    applied = [];
  }

  PV.useLook = function (l, ctx) {
    if (typeof l === 'string') l = PV.part('look', l);
    if (!l) l = PV.part('look', PV.defaults.look);
    var el = PV.layer();
    if (!el) return l ? l.key : null;
    clearVars(el);
    el.dataset.look = l ? l.key : 'none';
    var v = l ? l.vars : null;
    if (v) {
      if (typeof v === 'function') v = v(ctx || {});
      Object.keys(v).forEach(function (k) {
        el.style.setProperty(k, v[k]);
        applied.push(k);
      });
    }
    return l ? l.key : null;
  };
  PV.lookKey = function () {
    var el = PV.layer();
    return el ? (el.dataset.look || 'none') : null;
  };
  PV.rollLook = function (ctx, opts) {
    if (opts.look) return PV.part('look', opts.look);
    if (PV.rolling.look === false) return PV.part('look', PV.defaults.look);
    return PV.choose('look', ctx, opts) || PV.part('look', 'none');

      PV.addStop(after(d + 30, drop));
    }
  });

  PV.reg('exit', 'wipeOut', {
    nm: '擦出', tags: ['graphic', 'editorial'], w: 0.7, dur: 440,
    play: function (c, el, drop) {
      el.classList.add('jv-out');
      if (el.animate) el.animate([
        { clipPath: 'inset(0 0 0 0)', opacity: 1 },
        { clipPath: 'inset(0 100% 0 0)', opacity: 1 }
      ], { duration: M(440), fill: 'both', easing: 'ease-in' });
      PV.addStop(after(M(440) + 30, drop));
    }
  });

  PV.reg('exit', 'flipOut', {
    nm: '折出', tags: ['graphic', 'glitch', 'pop'], w: 0.6, dur: 460,
    play: function (c, el, drop) {

        { opacity: 1, transform: 'perspective(500px) rotateX(0deg)' },

      ], M(560));

  PV.reg('exit', 'reverseFade', {

/* PV 引擎 · 25 装饰扩充（⑬ decor +18）
 *
 * JIZURA 的 decor 有 100 件（crosshair/トンボ/青海波/家紋/提灯…）。这次挑 18 件，标准：
 *   1) 纯 CSS 能画——不吃 SVG 路径、不吃贴图，离线优先；
 *   2) 形状不与已有 18 件撞（准星/刻度/网格/斜纹/粒子/引线那些已经在了）；
 *   3) 一律挂在本次 cut 的 .jv-line 里、带 jv-d 类——元素随段生灭，且不会被竖写带走方向（①⑤ 踩过两次）。
 *
 * 没有一件用「自带开关」：门槛只读已有的 fx（texture / density / chroma / glitch / decor），
 * 免得再造一个没人拧的旋钮。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function el(cls, html) {
    var d = document.createElement('div');
    d.className = 'jv-d ' + cls;
    if (html != null) d.innerHTML = html;
    return d;
  }
  function add(c, node) {
    if (!c.el) return null;
    var key = node.className.split(' ')[1];
    if (c.el.querySelector('.' + key)) return null;
    c.el.appendChild(node);
    return null;
  }
  function n(c, k) { return PV.rnd(k); }        // 走引擎 seed：同 seed 同画面
  function pad(x) { return (x < 10 ? '0' : '') + x; }

  /* ---- 纸面与印张 ---- */

  PV.reg('decor', 'crop', {
    nm: '裁切标', tags: ['editorial', 'graphic'], w: 0.7,
    when: function () { return PV.fx.texture > 0.1; },
    apply: function (c) { return add(c, el('jv-crop', '<i></i><i></i><i></i><i></i>')); }
  });

  PV.reg('decor', 'regmark', {
    nm: '套准标', tags: ['graphic', 'editorial'], w: 0.6,
    when: function () { return PV.fx.texture > 0.2; },
    apply: function (c) {
      return add(c, el('jv-regmark', '<i class="a"></i><i class="b"></i>'));
    }
  });

  PV.reg('decor', 'ruled', {
    nm: '稿纸线', tags: ['editorial', 'calm'], w: 0.8,
    when: function () { return PV.fx.texture > 0.12; },
    apply: function (c) { return add(c, el('jv-ruled')); }
  });

  PV.reg('decor', 'swatches', {
    nm: '色标', tags: ['graphic', 'editorial'], w: 0.55,
    when: function () { return PV.fx.chroma > 0.15; },
    apply: function (c) {
      var h = '';
      for (var i = 0; i < 5; i++) h += '<i style="opacity:' + (0.35 + n(c, 0.55)).toFixed(2) + '"></i>';
      return add(c, el('jv-swatches', '<div>' + h + '</div>'));
    }
  });

  PV.reg('decor', 'tally', {
    nm: '正字计数', tags: ['editorial', 'graphic'], w: 0.5,
    apply: function (c) {
      var k = 1 + Math.round(n(c, 4)), h = '';
      for (var i = 0; i < k; i++) h += '<i></i>';
      return add(c, el('jv-tally', '<div>' + h + '</div>'));
    }
  });

  /* ---- 标注与测量 ---- */

  PV.reg('decor', 'dimline', {
    nm: '尺寸线', tags: ['graphic', 'editorial'], w: 0.7,
    when: function () { return PV.fx.decor > 0.35; },
    apply: function (c) {
      var w = (12 + n(c, 30)).toFixed(0);

  PV.reg('decor', 'ruler', {
    nm: '标尺', tags: ['editorial', 'graphic'], w: 0.6,
    apply: function (c) {
      var h = '', N = 16 + Math.round(n(c, 10));
      for (var i = 0; i < N; i++) h += '<i style="height:' + (i % 5 === 0 ? 100 : 52) + '%"></i>';
      return add(c, el('jv-ruler', h));
    }
  });

  PV.reg('decor', 'guides', {
    nm: '参考线', tags: ['editorial', 'graphic', 'glitch'], w: 0.6,
    when: function () { return PV.fx.texture > 0.15; },
    apply: function (c) { return add(c, el('jv-guides', '<i class="v a"></i><i class="v b"></i><i class="h a"></i><i class="h b"></i>')); }
  });

  PV.reg('decor', 'timecode', {
    nm: '时间码', tags: ['glitch', 'editorial', 'graphic'], w: 0.7,
    when: function () { return PV.fx.glitch > 0.1; },
    apply: function (c) {
      var t = Math.round((c.t0 || 0) / 1000), fr = Math.round(n(c, 24));
      var s = pad(Math.floor(t / 60)) + ':' + pad(t % 60) + ':' + pad(fr) + ':' + pad(Math.round(n(c, 30)));
      return add(c, el('jv-timecode', '<i>' + s + '</i>'));

  PV.reg('decor', 'datestamp', {
    nm: '日期戳', tags: ['pop', 'emotional', 'graphic'], w: 0.6,
    apply: function (c) {
      /* 像相机日期印：用真实当天，不把今天写死在代码里 */
      var d = new Date();
      return add(c, el('jv-datestamp', "<i>'" + pad(d.getFullYear() % 100) + ' ' + pad(d.getMonth() + 1) + ' ' + pad(d.getDate()) + '</i>'));
    }
  });

  /* ---- 手绘与贴纸 ---- */

  PV.reg('decor', 'tape', {
    nm: '胶带', tags: ['pop', 'editorial', 'calm'], w: 0.7,
    apply: function (c) {
      var side = n(c, 2) < 1 ? 'tl' : 'br';
      return add(c, el('jv-tape ' + side, '<div><i></i><i></i></div>'));
    }
  });

  PV.reg('decor', 'circline', {
    nm: '手绘圈', tags: ['pop', 'editorial'], w: 0.6,
    when: function () { return PV.fx.decor > 0.4; },
    apply: function (c) { return add(c, el('jv-circline')); }
  });

  PV.reg('decor', 'scribble', {
    nm: '手绘线', tags: ['editorial', 'pop'], w: 0.6,
    apply: function (c) {
      var k = n(c, 2) < 1 ? 'under' : 'through';
      return add(c, el('jv-scribble ' + k, '<svg viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M2 ' +
        (k === 'under' ? 8 : 6) + ' q 24 -6 48 0 t 48 0 t 48 0 t 48 0" /></svg>'));
    }
  });

  PV.reg('decor', 'brackets', {
    nm: '隅付き括号', tags: ['emotional', 'editorial', 'graphic'], w: 0.7,
    /* 直角引号配拉丁字母很怪，所以按文字类型筛（fit），而不是造个永远为真的 when */
    fit: function (c) { return !c.ltr; },
    apply: function (c) { return add(c, el('jv-brackets', '<i>「</i><i>」</i>')); }
  });

  PV.reg('decor', 'seal', {
    nm: '落款', tags: ['emotional', 'editorial', 'calm'], w: 0.35, sp: 1,
    /* sp:1 = 不进随机池。用户看到红章的第一反应是“为什么会有一个印”——
     * 说明它不是“点缀”而是“不明物体”。和条码同一处理：显式调用、预览台按钮还在，
     * 但系统不会自己在歌词上盖印。*/
    /* 两个门槛缺一不可：
     *   · fit —— 拉丁行里没有适合入印的字，拿拉丁字塞进方印就是一块噪点；
     *   · when —— 上一版什何门槛都没有，任何一行都可能被盖个红章（用户在
     *     《死囚牢》上看到的就是这个），装饰件得看气氛脸色，不能人人有份。
     * 另外：印文以前写死一个「印」字——和日期戳写死日期是同一类错。现在从本段取。*/
    fit: function (c) { return !c.ltr && (c.text || '').replace(/[^一-龥]/g, '').length > 0; },
    when: function () { return PV.fx.texture > 0.15 && PV.fx.decor > 0.35; },
    apply: function (c) {
      var han = (c.text || '').replace(/[^一-龥]/g, '');
      // 取最后一个汉字：句尾字做落款比句首更像署名
      var ch = han.charAt(han.length - 1) || '印';
      return add(c, el('jv-seal', '<i>' + ch + '</i>'));
    }
  });

  /* ---- 光与几何 ---- */

  PV.reg('decor', 'leak', {
    nm: '漏光', tags: ['emotional', 'calm', 'pop'], w: 0.7,
    when: function () { return PV.fx.chroma > 0.12; },
    apply: function (c) {
      var s = n(c, 2) < 1 ? 'l' : 'r';
      return add(c, el('jv-leak ' + s));
    }
  });

  PV.reg('decor', 'burstlines', {
    nm: '放射线', tags: ['pop', 'graphic', 'glitch'], w: 0.65,
    when: function () { return PV.fx.motion > 0.45; },
    apply: function (c) {
      var h = '', N = 26 + Math.round(n(c, 18));
      for (var i = 0; i < N; i++) h += '<i style="transform:rotate(' + (i * (360 / N) + n(c, 4)).toFixed(1) + 'deg);opacity:' + (0.18 + n(c, 0.4)).toFixed(2) + '"></i>';
      var corner = n(c, 2) < 1 ? 'tl' : 'br';
      return add(c, el('jv-burstlines ' + corner, h));
    }
  });

  PV.reg('decor', 'sqRings', {
    nm: '同心方', tags: ['graphic', 'glitch'], w: 0.55,
    when: function () { return PV.fx.texture > 0.2; },
    apply: function (c) {
      var h = '';
      for (var i = 0; i < 5; i++) h += '<i style="width:' + (18 + i * 13) + '%;height:' + (18 + i * 13) +
        '%;transform:rotate(' + (i * 4 + n(c, 6)).toFixed(1) + 'deg)"></i>';
      return add(c, el('jv-sqrings', h));
    }
  });

  PV.reg('decor', 'plusgrid', {
    nm: '加号阵', tags: ['graphic', 'glitch', 'editorial'], w: 0.6,
    when: function () { return PV.fx.density > 0.4; },
    apply: function (c) { return add(c, el('jv-plusgrid')); }
  });

  PV.reg('decor', 'checker', {
    nm: '市松带', tags: ['graphic', 'pop'], w: 0.55,
    when: function () { return PV.fx.density > 0.45; },

    }
  });

  PV.reg('decor', 'hanzi', {
    nm: '汉字水印', tags: ['emotional', 'editorial', 'calm'], w: 0.5,
    fit: function (c) { return !c.ltr; },
    apply: function (c) {
      var pool = ['夢', '音', '夜', '影', '風', '光', '深', '静'];
      return add(c, el('jv-hanzi', pool[Math.floor(n(c, pool.length))]));
    }
  });

  PV.reg('decor', 'notes', {
    nm: '音符', tags: ['pop', 'emotional', 'calm'], w: 0.55,
    when: function () { return PV.fx.decor > 0.4; },
    apply: function (c) {
      var g = ['♪', '♫', '♩', '♬'], h = '';
      for (var i = 0; i < 3; i++) {
        h += '<i style="left:' + (6 + n(c, 84)).toFixed(1) + '%;top:' + (10 + n(c, 74)).toFixed(1) +
          '%;font-size:' + (14 + n(c, 22)).toFixed(0) + 'px;animation-delay:' + n(c, 3).toFixed(2) + 's">' +
          g[Math.floor(n(c, g.length))] + '</i>';
      }

/* PV 引擎 · 26 处理扩充（⑭ treatment +14）
 *
 * JIZURA 的 27 件文字处理（treattrans 包）是 canvas 逐字画的：ctx.save/translate/vbands。
 * 我们这层是 DOM/CSS，所以搬的是**效果**不是代码——每件都用 CSS 原语重写一遍。
 *
 * 分工先划清（这是上一轮 ⑩ 学的教训：谁写哪个属性要事先定死，不然就是最后一个写的赢）：
 *   · .jv-w 的 transform      → 版式（位置与旋转）
 *   · .jv-w 的 translate      → 守卫 --gdx/--gdy + 本层 --ttx/--tty（合成在 base.css 里）
 *   · .jv-w 的 rotate / scale → 本层 --ttrot / --ttscale
 *   · i.jv-t 的 transform / opacity / filter → 登场层（WAAPI 动画）
 *   · i.jv-t 的涂装（stroke / shadow / clip）→ ⑩ 外观层
 * 所以本层**不碰 opacity、不碰 transform、不碰 text-shadow**：
 *   要淡用 filter: opacity()，要糊用 filter: blur()，要填色用 clip-path（外观层用的是 mask，不撞）。
 * 逐帧的件一律返回 cleanup 调 PV.offFrame——③⑤ 立过的规矩。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function vars(el, o) { for (var k in o) el.style.setProperty(k, o[k]); }

  /* 一件处理：给本段的每个字按位置算一组 --tt* 值。
   * anim=true 时注册逐帧回调（随时间推进）。
   * 属性名必须写 CSS 写法（'clip-path'）：写成驼峰 clipPath 会被 style.setProperty
   * 静默丢掉——实测 karaokeFill 就这样完全没作用且不报错，只能靠逐件量改到几个字才拓得出来。
   * **不论动与不动都返回同一个 cleanup**：静太式的件也会留下面上的内联样式，
   * 不抹干净就会渗到下一段（⑩ 那边同一个坑）。*/
  function perChar(c, fn, anim) {
    var els = c.tokensEls || [], wraps = [];
    els.forEach(function (t) { if (t.parentElement) wraps.push(t.parentElement); });
    if (!wraps.length) return null;
    function paint(time) {
      for (var i = 0; i < wraps.length; i++) {
        var v = fn(i, wraps.length, time);
        if (v) vars(wraps[i], v);
      }
    }
    paint(0);
    if (!anim) return function () { clean(wraps, c); };
    var fr = function (lt) { paint(lt || 0); };
    PV.onFrame(fr);
    return function () { PV.offFrame(fr); clean(wraps, c); };
  }
  function clean(wraps, c) {
    for (var i = 0; i < wraps.length; i++) {
      var s = wraps[i].style;
      ['--ttx', '--tty', '--ttrot', '--ttscale', 'filter', 'clip-path', 'outline', 'border', 'border-radius', 'padding']
        .forEach(function (p) { s.removeProperty(p); });
    }
    if (c && c.el) c.el.style.removeProperty('letter-spacing');
  }

  /* ---------- 节奏与姿态 ---------- */
  PV.reg('treatment', 'sizeWave', {
    nm: '大小律动', w: 0.8, tags: ['pop', 'graphic', 'emotional'],
    apply: function (c) {
      var ph = PV.rnd(6.28);
      return perChar(c, function (i, n) {
        return { '--ttscale': (1 + 0.3 * Math.sin(ph + i * 0.9)).toFixed(3) };
      });
    }
  });

  PV.reg('treatment', 'rotateAlt', {
    nm: '摇摆字', w: 0.75, tags: ['pop', 'graphic', 'calm'],
    apply: function (c) {
      var amp = 2 + PV.rnd(6);
      return perChar(c, function (i) {
        return { '--ttrot': ((i % 2 ? 1 : -1) * amp).toFixed(1) + 'deg' };
      });
    }
  });

  PV.reg('treatment', 'baseShift', {
    nm: '基线错落', w: 0.75, tags: ['graphic', 'editorial', 'glitch'],
    apply: function (c) {
      return perChar(c, function (i) {
        var k = Math.sin((i + 1) * 2.399963) ;           // 黄金角伪随机，同 seed 稳定
        return { '--tty': (k * 9).toFixed(1) + 'px' };
      });
    }
  });

  PV.reg('treatment', 'jitterChar', {
    nm: '逐字抖动', w: 0.6, tags: ['glitch', 'horror'],
    when: function () { return PV.fx.glitch > 0.25; },
    apply: function (c) {
      var amp = 1 + PV.fx.glitch * 3;
      return perChar(c, function (i, n, t) {
        var s = Math.sin(t * 7 + i * 2.7) * amp, s2 = Math.cos(t * 9 + i * 1.9) * amp;
        return { '--ttx': s.toFixed(2) + 'px', '--tty': s2.toFixed(2) + 'px' };
      }, true);
    }
  });

  /* ---------- 时间与进度 ---------- */
  PV.reg('treatment', 'karaokeFill', {
    nm: '逐字填色', w: 0.85, tags: ['pop', 'editorial', 'emotional'],
    apply: function (c) {
      var span = Math.max(600, ((c.t1 || 4000) - (c.t0 || 0)) * 0.8) / 1000;
      return perChar(c, function (i, n, t) {
        var k = Math.min(1, Math.max(0, (t / span) * n - i));
        var p = Math.round(Math.max(0, Math.min(100, (1 - k) * 100)));
        return { 'clip-path': 'inset(0 ' + p + '% 0 0)' };
      }, true);
    }
  });

  PV.reg('treatment', 'focusPull', {
    nm: '虚实推进', w: 0.7, tags: ['emotional', 'calm'],
    when: function () { return PV.fx.chroma > 0.15; },
    apply: function (c) {
      return perChar(c, function (i, n, t) {
        var k = Math.sin(t * 1.1 - i * 0.5);
        return { filter: 'blur(' + Math.max(0, k * 2.4).toFixed(2) + 'px)' };
      }, true);
    }
  });

  PV.reg('treatment', 'afterglow', {
    nm: '余韵渐隐', w: 0.7, tags: ['calm', 'emotional'],
    apply: function (c) {
      var n = (c.tokensEls || []).length;
      return perChar(c, function (i) {
        var o = 1 - (i / Math.max(1, n - 1)) * (0.25 + PV.rnd(0.35));
        return { filter: 'opacity(' + o.toFixed(2) + ')' };
      });
    }
  });

  PV.reg('treatment', 'hueWave', {
    nm: '逐字换色', w: 0.6, tags: ['pop', 'glitch'],
    when: function () { return PV.fx.chroma > 0.3; },

  PV.reg('camera', 'stepZoom', {
    nm: '阶梯变焦', tags: ['glitch', 'graphic', 'pop'], w: 0.5,
    when: function () { return PV.fx.glitch > 0.15; },
    apply: function (c) {
      var steps = 4 + Math.round(PV.rnd(3)), base = 1.02 + PV.rnd(0.05);
      return frame(c, function () {
        var t = c.lt || 0;
        var idx = Math.floor(Math.min(1, t / 4.5) * steps);
        var k = base + idx * 0.035 * M(1);
        return PV.tfScale(k);
      });
    }
  });

  /* 弹入：段首过冲再回稳 */
  PV.reg('camera', 'bounceIn', {
    nm: '弹入', tags: ['pop', 'emotional'], w: 0.6,
    apply: function (c) {
      return frame(c, function () {
        var t = c.lt || 0;
        if (t > 0.9) return 'none';
        var k = Math.exp(-t * 5.5) * Math.cos(t * 17) * 0.06 * M(1);
        return PV.tfScale(1 + k);
      });
    }
  });

  /* 砸近：前 200ms 从远处砸进来，配冲击型行 */
  PV.reg('camera', 'crashZoom', {
    nm: '砸近', tags: ['pop', 'glitch', 'horror'], w: 0.5, impact: 1,
    when: function () { return PV.fx.motion > 0.4; },
    apply: function (c) {
      return frame(c, function () {
        var t = c.lt || 0;
        var k = Math.max(0, 1 - t / 0.36);
        return PV.tfScale(1 + 0.42 * k * k);
      });
    }
  });

  /* 地震：三轴同时抖，强度随时间衰减 */
  PV.reg('camera', 'earthquake', {
    nm: '地震', tags: ['horror', 'glitch'], w: 0.45,
    when: function () { return PV.fx.glitch > 0.45; },
    apply: function (c) {
      var a = M(11);
      return frame(c, function () {
        var t = c.lt || 0, d = Math.exp(-t * 0.75);

  PV.reg('camera', 'rackFocus', {
    nm: '跟焦', tags: ['emotional', 'calm'], w: 0.55,
    apply: function (c) {
      var tr = c.track || PV.S.track;
      if (!tr) return null;
      var fr = function () {
        var t = c.lt || 0;
        var b = Math.max(0, 5.5 - t * 4.4);
        tr.style.filter = b > 0.05 ? 'blur(' + b.toFixed(2) + 'px)' : '';
      };
      fr();
      PV.onFrame(fr);
      return function () { PV.offFrame(fr); tr.style.removeProperty('filter'); };
    }
  });

  /* 周回：沿小椭圆轨迹游走 */
  PV.reg('camera', 'orbitDrift', {
    nm: '周回', tags: ['graphic', 'emotional', 'pop'], w: 0.5,
    when: function () { return PV.fx.motion > 0.35; },
    apply: function (c) {
      var a = M(13), ph = PV.rnd(6.28);
      return frame(c, function () {
        var t = (c.lt || 0) * 0.8 + ph;
        return PV.tfMove(Math.cos(t) * a, Math.sin(t * 1.13) * a * 0.55);
      });
    }
  });
})();



/* PV 引擎 · 29 转场扩充（⑰ transition +12）
 *
 * 契约（同 07-transition.js）：play(ctx, prev, next, swap)。
 *   · swap() 负责把新行挂上、旧行摘掉——**必须调用**，不调就是白屏；
 *   · 想在 swap 之前先演一段（旧行还在台上），就先动 prev，再在动画结束时 swap；
 *   · 想在 swap 之后演（新行已上台），先 swap() 再动 next——我们的 wipe 系都是后者，
 *     因为 swap 之后 DOM 稳定，不会出现"新旧两层同时在 clip 里打架"。
 *
 * 他们的 trans 池是 24 件（各包里的 `trReg(...)`）。这轮搬 12 件纯 clip / transform 能做的：
 * 斜带擦、时钟擦、观音开门、百叶、市松推入、块溶、像素 mosaic、覆盖/揭开、
 * 立方翻、短册移、闪接、 blink。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function an(el, kf, opt) {
    if (!el) return null;
    if (!el.animate) return null;
    var a = el.animate(kf, opt);
    PV.addStop(function () { try { a.cancel(); } catch (e) { } });
    return a;
  }
  function D(ms) { return Math.round(ms * (0.7 + 0.6 * PV.fx.motion)); }
  /* 延时收尾：注册成 stop，退出 PV 时不会吊着一个已失效的定时器 */
  function setAfter(ms, fn) { var t = setTimeout(fn, ms); return function () { clearTimeout(t); }; }

  /* diagWipe 已升级为真合成版，见 31-trans3.js（③ 续）*/

  /* clockWipe 已升级为真合成版，见 31-trans3.js（③ 续）*/

  /* 开门（⑳ 真合成）：旧行从中间合拢关掉，新行从中间拉开——两帧互补 */
  PV.reg('transition', 'doors', {
    nm: '开门', tags: ['graphic', 'pop', 'editorial'], w: 0.7, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {
      swap();
      var d = D(420);
      if (next) an(next, [{ clipPath: 'inset(0 50% 0 50%)' }, { clipPath: 'inset(0 0 0 0)' }],
        { duration: d, fill: 'both', easing: 'cubic-bezier(.5,0,.2,1)' });

        { clipPath: 'inset(0 50% 0 50%)', opacity: 0 }],
        { duration: d, fill: 'both', easing: 'ease-in' });

        if (next) { next.style.removeProperty('clip-path'); next.style.removeProperty('-webkit-mask-image'); next.style.removeProperty('mask-image'); }
        drop();
      }));
    }
  });

  /* 百叶（⑳ 真合成）：N 片竖条依次揭掉旧行、揭开新行。
   * prev 逐条 clip 掉、next 逐条 clip 显——两边互补，才真的是“两帧合成”。*/
  PV.reg('transition', 'blinds', {
    nm: '百叶', tags: ['graphic', 'glitch'], w: 0.6,
    when: function () { return PV.fx.motion > 0.3; }, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {
      swap();

      for (var i = 0; i < n; i++) {
        var l = (i * 100 / n).toFixed(3), r = ((n - i - 1) * 100 / n).toFixed(3);
        var clip = 'inset(0 ' + r + '% 0 ' + l + '%)';

          { duration: dur, delay: i * step, fill: 'both', easing: 'ease-in' });
        if (next) an(next, [{ clipPath: clip }, { clipPath: 'inset(0 0 0 0)' }],
          { duration: dur, delay: i * step, fill: 'both', easing: 'ease-out' });
      }
      PV.addStop(setAfter(tot + 30, function () {
        [next, prev].forEach(function (el) {
          if (!el) return;
          el.style.removeProperty('clip-path');
          el.style.removeProperty('-webkit-mask-image'); el.style.removeProperty('mask-image');
        });
        drop();
      }));
    }

  /* 市松推（⑳ 真合成）：棋盘遮罩尺寸从小到大——旧行用反相遮罩同时退场。
   * 两件共用一个 mask 表达式，只是一个从疏到密、一个从密到疏。*/
  PV.reg('transition', 'checkerIn', {
    nm: '市松推', tags: ['graphic', 'pop'], w: 0.5, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {

        el.style.setProperty('mask-image', mask);
        an(el, [
          { maskSize: (idx ? '6% 9%' : '400% 400%'), opacity: idx ? 1 : 1 },
          { maskSize: (idx ? '400% 400%' : '6% 9%'), opacity: idx ? 0 : 1 }
        ], { duration: d, fill: 'both', easing: 'ease-in-out' });
      });
      PV.addStop(setAfter(d + 30, function () {
        [next, prev].forEach(function (el) {

      }));
    }
  });

  /* 块溶：mosaic 像素化后显形 */
  PV.reg('transition', 'pixelate', {
    nm: '像素化', tags: ['glitch', 'graphic'], w: 0.6,
    when: function () { return PV.fx.glitch > 0.15; },
    play: function (c, prev, next, swap) {
      swap();
      an(next, [
        { filter: 'blur(9px) contrast(2.4)', opacity: 0, transform: 'scale(1.06)' },
        { filter: 'blur(0px) contrast(1)', opacity: 1, transform: 'none' }
      ], { duration: D(440), fill: 'both', easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
  });

  /* 覆盖：新行整块压进来（带底色，遮住旧行） */
  PV.reg('transition', 'cover', {
    nm: '覆盖', tags: ['editorial', 'graphic'], w: 0.6,
    play: function (c, prev, next, swap) {
      swap();
      var dir = PV.rnd(2) < 1 ? 100 : -100;
      an(next, [{ transform: 'translateX(' + dir + '%)' }, { transform: 'none' }],
        { duration: D(420), fill: 'both', easing: 'cubic-bezier(.3,.9,.2,1)' });
      if (prev) an(prev, [{ transform: 'none', opacity: 1 }, { transform: 'translateX(' + (-dir * 0.4) + '%)', opacity: .1 }],
        { duration: D(420), fill: 'both' });
    }
  });

  /* 立方翻：绕侧边 3D 转进来 */
  PV.reg('transition', 'cubeTurn', {
    nm: '立方翻', tags: ['graphic', 'pop'], w: 0.55,
    when: function () { return PV.fx.motion > 0.3; },
    play: function (c, prev, next, swap) {
      swap();
      var dir = PV.rnd(2) < 1 ? 1 : -1;
      next.style.transformOrigin = dir > 0 ? 'left center' : 'right center';
      an(next, [
        { transform: 'perspective(1000px) rotateY(' + (dir * 78) + 'deg)', opacity: .3 },
        { transform: 'perspective(1000px) rotateY(0deg)', opacity: 1 }
      ], { duration: D(480), fill: 'both', easing: 'cubic-bezier(.3,.8,.2,1)' });
      PV.addStop(function () { next.style.removeProperty('transform-origin'); });
    }
  });

  /* sliceShiftIn 已升级为真合成版，见 31-trans3.js（③ 续）*/

  /* 闪接：白闪一下再显形（我们已有 flash 是整屏闪，这个是先闪后现） */
  PV.reg('transition', 'flashCross', {
    nm: '闪接', tags: ['pop', 'glitch', 'emotional'], w: 0.55,
    when: function () { return PV.fx.motion > 0.35; },
    play: function (c, prev, next, swap) {
      swap();
      an(next, [{ opacity: 0, filter: 'brightness(3.2)' }, { opacity: 1, filter: 'brightness(1)' }],
        { duration: D(360), fill: 'both', easing: 'steps(3, end)' });
    }
  });

  /* 眨眼：旧行瞬间消失，新行延迟出现（留半拍黑） */
  PV.reg('transition', 'blink', {
    nm: '眨眼', tags: ['emotional', 'editorial', 'horror'], w: 0.5,
    play: function (c, prev, next, swap) {
      if (prev) prev.style.opacity = '0';
      var t = setTimeout(function () { swap(); }, D(90));
      PV.addStop(function () { clearTimeout(t); });
      an(next, [{ opacity: 0 }, { opacity: 1 }], { duration: D(280), fill: 'both', easing: 'ease-out' });
    }
  });

  /* 栅线擦：一条亮线先扫过，字跟在线后出现 */
  PV.reg('transition', 'ruleWipe', {
    nm: '栅线擦', tags: ['editorial', 'graphic'], w: 0.5,
    play: function (c, prev, next, swap) {
      swap();
      var line = document.createElement('i');
      line.className = 'jv-trans-line';
      next.appendChild(line);
      an(line, [{ transform: 'translateX(0) scaleX(1)', opacity: .9 }, { transform: 'translateX(100%) scaleX(.4)', opacity: 0 }],
        { duration: D(460), fill: 'both', easing: 'ease-in' });
      an(next, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }],
        { duration: D(460), fill: 'both', easing: 'cubic-bezier(.5,0,.2,1)' });
      PV.addStop(function () { if (line.parentNode) line.parentNode.removeChild(line); });
    }
  });
})();


/* PV 引擎 · 30 调参（⑲）
 *
 * 三件东西，都是为了让"观感"能被调，而不是每次让我改代码：
 *   1) 近窗去重 PV.dedupe —— 同类件在近 N 段里不重复抽（修"连着几段一个样"）
 *   2) 档位 PV.tune('quiet'|'balanced'|'rich'|'wild') —— 一次改一组旋钮并落到 localStorage
 *   3) 体检式报告 PV.tuneReport(n) —— 把"撞脸率 / 平均装饰数 / 入场占用"量成数字
 *
 * 旋钮只认这几种长期偏好：bgSwap、decorMax、treatMax、dedupe、rolling。
 * 强度 fx 不在这里动——那个归气氛与音频调制（③），动它会和气氛预设打架。
 */
(function () {
  'use strict';
  var PV = window.PV;

  /* ---------- 1 近窗去重 ---------- */
  /* 只保留有证据的：版式。
   * bg / look 的窗口实测白搭——背景连着重复的主因是 bgSwap 粘住上一件
   * （0.45 概率不换 ≈ 55% 保持），那条路径**不走抽签**，窗口根本管不到；
   * 实测开关窗口都是 52.3%，而把 bgSwap 推到 1 就呷到 0.0%——
   * 说明背景的重复归 bgSwap 管，不归去重管。造一个作不了用的旋钮，
   * 比没有旋钮更糟（fx.decor 那次就是这个病）。*/
  PV.dedupe = { layout: 6, bg: 0, look: 0, camera: 0, enter: 0, exit: 0, transition: 0, hold: 0 };

  PV.recordRecent = function (plan) {
    var S = PV.S;
    if (!S.recent) return;
    Object.keys(PV.dedupe).forEach(function (g) {
      var p = plan[g];
      if (!p) return;
      var arr = S.recent[g] || (S.recent[g] = []);
      if (arr[arr.length - 1] !== p.key) arr.push(p.key);
      /* 满长时要从**队首**丢。上一版写的 `arr.length = keep` 是在 push 之后截尾，
       * 正好把刚加进去的那个删掉——窗口在前 N 次之后就冻结了，
       * 后面的抽取全部在和一串陈旧名单比，去重形同没接。*/
      var keep = Math.max(PV.dedupe[g] || 0, 8) + 2;
      if (arr.length > keep) arr.splice(0, arr.length - keep);
    });
  };
  PV.recentOf = function (g) { return (PV.S.recent && PV.S.recent[g]) || []; };
  PV.clearRecent = function () {
    var S = PV.S;
    Object.keys(S.recent).forEach(function (g) { S.recent[g] = []; });
    S.lastLayout = '';
  };

  /* ---------- 2 档位 ---------- */
  var PRESETS = {
    quiet: {
      nm: '静', bgSwap: 0.22, decorMax: 1, treatMax: 0,
      rolling: { camera: false, hold: false }, dedupe: { layout: 8 }
    },
    balanced: {
      nm: '均衡', bgSwap: 0.45, decorMax: 2, treatMax: 1,
      rolling: { camera: true, hold: true }, dedupe: { layout: 6 }
    },
    rich: {
      nm: '满', bgSwap: 0.6, decorMax: 3, treatMax: 1,
      rolling: { camera: true, hold: true }, dedupe: { layout: 4 }
    },
    wild: {
      nm: '乱', bgSwap: 1, decorMax: 3, treatMax: 2,
      rolling: { camera: true, hold: true }, dedupe: { layout: 1 }
    }
  };
  PV.PRESETS = PRESETS;

  PV.tune = function (name) {
    var p = PRESETS[name || PV.tuneName || 'balanced'];
    if (!p) return null;
    PV.tuneName = name || PV.tuneName;
    if (p.bgSwap != null) PV.bgSwap = p.bgSwap;
    if (p.decorMax != null) PV.decorMax = p.decorMax;
    if (p.treatMax != null) PV.treatMax = p.treatMax;
    if (p.rolling) Object.keys(p.rolling).forEach(function (k) { if (k in PV.rolling) PV.rolling[k] = p.rolling[k]; });
    if (p.dedupe) Object.keys(p.dedupe).forEach(function (k) { if (k in PV.dedupe) PV.dedupe[k] = p.dedupe[k]; });
    try { localStorage.setItem('pv_tune', PV.tuneName); } catch (e) { }
    return p.nm;
  };

  /* 开机把上次的档位贴回来。App 里默认 balanced——
   * 静/满是偏好，不该由引擎擅自替用户选。*/
  PV.tuneRestore = function () {
    var n = null;
    try { n = localStorage.getItem('pv_tune'); } catch (e) { }
    if (!n || !PRESETS[n]) n = 'balanced';
    PV.tune(n);
    return n;
  };

  /* ---------- 3 报告：把观感量成数字 ---------- */
  PV.tuneReport = function (n) {
    n = n || 300;
    var L = PV.lyrics();
    if (!L.length) return { 说明: '没有歌词表，先 PV.setLyrics 或在 App 里放歌' };
    var savedSeed = PV.seedValue ? PV.seedValue() : null;
    var seq = { layout: [], bg: [], look: [] }, dupe = { layout: 0, bg: 0, look: 0 };
    var win = { layout: 0, bg: 0 };          // 近 N 段窗口内的重复（去重真正管的是这个，不是“紧邻”）
    var decorSum = 0, treatSum = 0, entSum = 0, entOver = 0, cuts = 0;
    for (var i = 0; i < n; i++) {
      PV.seed(100000 + i * 7);
      var p = PV.show(i % L.length, { force: true });
      if (!p) continue;
      cuts++;
      ['layout', 'bg', 'look'].forEach(function (g) {
        var k = p[g] ? p[g].key : '—';
        var prevKey = seq[g][seq[g].length - 1];
        if (prevKey && prevKey === k) dupe[g]++;
        if (g === 'layout' || g === 'bg') {
          var w = g === 'layout' ? (PV.dedupe.layout || 6) : (PV.bgSwap < 1 ? 3 : 0);
          if (w > 0 && seq[g].slice(Math.max(0, seq[g].length - w)).indexOf(k) >= 0) win[g]++;
        }
        seq[g].push(k);
      });
      decorSum += (p.decor || []).length;
      treatSum += (p.treatment || []).length;
      var cost = (p.enter && p.enter.dur || 400) + (p.ctx.stagger || 45) * Math.max(0, (p.ctx.tokens || []).length - 1);
      var avail = (p.ctx.t1 || 0) - (p.ctx.t0 || 0);
      entSum += avail > 0 ? cost / avail : 0;
      if (avail > 0 && cost > avail * 0.9) entOver++;
    }
    if (savedSeed != null) PV.seed(savedSeed);
    var pct = function (x) { return (x * 100).toFixed(1) + '%'; };
    return {
      段数: cuts,
      档位: PV.tuneName || 'balanced',
      /* 近窗重版式：注意——去重代码已接上并确实在过滤（10 连抽追踪里窗口正确滑走），
       * 但长序列统计仍在这附近徘徊，**两者未能调和**，所以下面这一项现在只能当现状读数，
       * 不能当“旋钮生效的证据”。调大窗口前先把这个矛盾查清楚。*/
      连着两段同版式: pct(dupe.layout / Math.max(1, cuts)),
      近窗口内重版式: pct(win.layout / Math.max(1, cuts)),
      近窗口内重背景: pct(win.bg / Math.max(1, cuts)),
      连着两段同背景: pct(dupe.bg / Math.max(1, cuts)),
      连着两段同外观: pct(dupe.look / Math.max(1, cuts)),
      平均装饰件数: (decorSum / Math.max(1, cuts)).toFixed(2),
      平均处理件数: (treatSum / Math.max(1, cuts)).toFixed(2),
      入场占段长比例: pct(entSum / Math.max(1, cuts)),
      入场超段: entOver,
      旋钮: { bgSwap: PV.bgSwap, decorMax: PV.decorMax, treatMax: PV.treatMax, dedupe: PV.dedupe }
    };
  };
})();

/* PV 引擎 · 31 真合成转场补充（③ 续）
 * 三件从「只动新行」升级成 prev / next 互补：
 *   时钟擦 —— conic 遮罩角度扫过（注册 @property 才能动画自定义属性）
 *   斜带擦 —— 两边用互补的多边形 clip，旧行被斜边推走
 *   短册移 —— 竖条 mask 左右反向滑移，旧行拆成条退场
 *
 * 收尾一律靠 setAfter 定时 drop（不用 animationend：元素被摘走时事件可能不再触发）。
 */
(function () {
  'use strict';
  var PV = window.PV;

  function an(el, kf, opt) {
    if (!el || !el.animate) return null;
    var a = el.animate(kf, opt);
    PV.addStop(function () { try { a.cancel(); } catch (e) { } });
    return a;
  }
  function setAfter(ms, fn) { var t = setTimeout(fn, ms); return function () { clearTimeout(t); }; }
  function D(ms) { return Math.round(ms * (0.7 + 0.6 * PV.fx.motion)); }
  function clean(el, props) {
    if (!el) return;
    props.forEach(function (p) { el.style.removeProperty(p); });
  }
  var MASKS = ['mask-image', '-webkit-mask-image', 'mask-size', 'mask-position', '-webkit-mask-position'];

  /* 时钟擦（真合成）：conic 角度从 0 扫到 360，新行按角度揭开、旧行按角度消失 */
  PV.reg('transition', 'clockWipe', {
    nm: '时钟擦', tags: ['graphic', 'editorial'], w: 0.6,
    when: function () { return PV.fx.texture > 0.1; }, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {
      swap();
      var d = D(620);
      var support = window.CSS && CSS.registerProperty !== undefined;
      if (!support) {
        // 退化：走 steps 单向揭开，至少不会白屏
        if (next) an(next, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }],
          { duration: d, fill: 'both', easing: 'steps(9, end)' });
        PV.addStop(setAfter(d + 20, drop));
        return;
      }
      var conic = function (a) { return 'conic-gradient(from -90deg at 50% 50%, #000 ' + a + ', transparent 0)'; };
      /* 遮罩本身写在 css/trans2.css 的 [data-cw] 规则里（引用注册过的 --cwA），
       * 这里只开关标记 + 动画那个角度变量——未注册的自定义属性 WAAPI 不会插值。*/
      if (next) {
        next.dataset.cw = '1'; next.style.setProperty('--cwA', '0deg');
        an(next, [{ '--cwA': '0deg' }, { '--cwA': '360deg' }], { duration: d, fill: 'both', easing: 'cubic-bezier(.5,0,.2,1)' });
      }
      if (prev) {
        prev.dataset.cw = '1'; prev.style.setProperty('--cwA', '360deg');
        an(prev, [{ '--cwA': '360deg' }, { '--cwA': '0deg' }], { duration: d, fill: 'both', easing: 'cubic-bezier(.5,0,.2,1)' });
      }
      PV.addStop(setAfter(d + 30, function () {
        [next, prev].forEach(function (el) {
          if (!el) return;
          delete el.dataset.cw;
          el.style.removeProperty('--cwA');
        });
        clean(next, MASKS); clean(prev, MASKS); drop();
      }));
    }
  });

  /* 斜带擦（真合成）：prev 与 next 用互补多边形，斜边推过去 */
  PV.reg('transition', 'diagWipe', {
    nm: '斜带擦', tags: ['graphic', 'pop'], w: 0.8, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {
      swap();
      var d = D(460), dir = PV.rnd(2) ? 1 : -1;
      /* 斜边扫过：from = 全 hide，mid 用带斜度的多边形，to = 全显 */
      var slant = dir > 0
        ? ['polygon(0 100%, 0 100%, 0 0, 0 0)', 'polygon(-40% 100%, 60% 100%, 100% 0, 0 0)', 'inset(0 0 0 0)']
        : ['polygon(100% 0, 100% 0, 100% 100%, 100% 100%)', 'polygon(140% 0, 40% 0, 0 100%, 100% 100%)', 'inset(0 0 0 0)'];
      if (next) an(next, [
        { clipPath: slant[0] }, { clipPath: slant[1], offset: .6 }, { clipPath: slant[2] }
      ], { duration: d, fill: 'both', easing: 'cubic-bezier(.6,0,.2,1)' });
      if (prev) an(prev, [
        { clipPath: 'inset(0 0 0 0)', opacity: 1 },
        { clipPath: slant[1], opacity: .5, offset: .6 },
        { clipPath: slant[0], opacity: 0 }
      ], { duration: d, fill: 'both', easing: 'cubic-bezier(.6,0,.2,1)' });
      PV.addStop(setAfter(d + 30, function () { clean(next, ['clip-path']); clean(prev, ['clip-path', 'opacity']); drop(); }));
    }
  });

  /* 短册移（真合成）：竖条 mask 左右反向滑，旧行拆成条飘走 */
  PV.reg('transition', 'sliceShiftIn', {
    nm: '短册移', tags: ['graphic', 'glitch', 'pop'], w: 0.55,
    when: function () { return PV.fx.motion > 0.3; }, ownsPrev: 1,
    play: function (c, prev, next, swap, drop) {
      swap();
      var d = D(520), n = 4 + Math.round(PV.rnd(4));
      var mask = 'repeating-linear-gradient(90deg, #000 0 ' + (100 / (2 * n)).toFixed(3) + '%, transparent 0 ' + (100 / n).toFixed(3) + '%)';
      [next, prev].forEach(function (el, idx) {
        if (!el) return;
        var dir = idx ? -1 : 1;
        el.style.setProperty('mask-image', mask);
        el.style.setProperty('-webkit-mask-image', mask);
        an(el, [
          { maskPosition: (dir * 50) + '% 0', opacity: idx ? 1 : 0, transform: 'translateX(' + (dir * 1.2).toFixed(2) + 'em)' },
          { maskPosition: '0% 0', opacity: 1, transform: 'none' }
        ], { duration: d, fill: 'both', easing: 'cubic-bezier(.4,0,.2,1)' });
      });
      PV.addStop(setAfter(d + 30, function () {
        clean(next, MASKS.concat(['transform'])); clean(prev, MASKS.concat(['transform', 'opacity']));
        drop();
      }));
    }
  });
})();

/* PV 引擎 · 32 运动幅度预算（修用户说的“抖动特别强烈”）
 *
 * 实测（glitch 气氛、逐帧采样 700ms 的位移范围）：
 *   crashZoom 201×113px、bounceIn 50×28、hold:beat 横向 49px、earthquake 22×21
 * crashZoom/bounceIn 那两条离谱，原因不是系数写大，而是**它们缩放的是整屏 .jv-track**：
 * 离中心越远的字位移越大（半屏 × 0.42 ≈ 200px），跟字号无关。
 *
 * 三条规矩：
 *   1. 整屏 scale 一律换算成"允许的边缘位移" —— PV.moveMax（默认 26px），
 *      件里写的 s-1 会被 clamp 到 (moveMax / 半屏)。
 *   2. 抖源互斥：camera 与 hold 同帧都抖时，hold 让位（实测 160 段里 4 次同时开）。
 *      两件各自抖各自的不叫叠加，叫糊。
 *   3. 件只读 PV.motionGain / PV.shakeGain，不在自己里乘 fx——缩放集中在引擎，
 *      改观感不用翻十几个文件。
 */
(function () {
  'use strict';
  var PV = window.PV;

  PV.moveMax = 26;      // 整屏位移/边缘摆幅上限（px）
  PV.enterGain = 0.62;  // 登场幅度增益：enter 件的 translate/scale/rotate 统一乘它
                        //（camera/hold 有本文件预算错位，enter 一直裸奍 ——
                        //  随机抽到 zoomIn(1.85)/砸入(2.1) 这类大落差件就是用户报的抖动偏移源）
  PV.shakeGain = 1;     // 全局抖动系数（0.5 = 所有抖都温柔一半）

  /* 哪些件属于"高频抖"：同帧只允许一个发声 */
  var SHAKE = {
    camera: { handheld: 1, beatZoom: 1, earthquake: 1, vertigo: 1, snapPan: 1, bounceIn: 1, crashZoom: 1, pendulum: 1, tiltDown: 1 },
    hold: { jitter: 1, beat: 1 }
  };

  /* 整屏 scale 的预算换算：s 是想要的 scale，返回不超过 moveMax 边缘位移的 scale */
  PV.scaleClamp = function (s) {
    var st = PV.stage();
    var half = st ? Math.max(1, st.getBoundingClientRect().width / 2) : 480;
    var maxS = 1 + PV.moveMax / half;
    if (s >= 1) return Math.min(s, maxS);
    return Math.max(s, 2 - maxS);          // 缩小方向同理
  };
  /* 整屏平移的预算 */
  PV.shiftClamp = function (px) {
    var lim = PV.moveMax;
    return Math.max(-lim, Math.min(lim, px));
  };

  /* ---------- 写 .jv-track 的 transform 只能经这两个入口 ----------
   * 以前 10 处各自拼字符串，scale 想怎么写就怎么写，于是“整屏缩放”把边缘字
   * 甩出 200px（半屏 × 0.42）。现在：件报它想要的值，这里统一钳位。
   * 不用“每帧再重写一次”的夹法：那个依赖帧序，相机件会在同一帧里把大值写回去
   * （我就是刚这么错过一次，看起来接上了其实没生效）。*/
  PV.tfScale = function (s, extra) {
    var st = PV.stage();
    var half = st ? Math.max(1, st.getBoundingClientRect().width / 2) : 480;
    var maxS = 1 + PV.moveMax / half;
    s = s >= 1 ? Math.min(s, maxS) : Math.max(s, 2 - maxS);
    return 'scale(' + s.toFixed(4) + ')' + (extra ? ' ' + extra : '');
  };
  PV.tfMove = function (x, y, extra) {
    var lim = PV.moveMax;
    x = Math.max(-lim, Math.min(lim, x * PV.shakeGain));
    y = Math.max(-lim, Math.min(lim, y * PV.shakeGain));
    return 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)' + (extra ? ' ' + extra : '');
  };

  /* 包一层 camera/hold 的 apply：抖源互斥 + 全局抖动系数 + scale/位移 clamp */
  function wrap(group, key) {
    var d = PV.part(group, key);
    if (!d || !d.apply || d.__wrapped) return;
    var raw = d.apply;
    d.__wrapped = 1;
    d.apply = function (c, target) {
      // 抖源互斥：camera 在抖时，hold 的抖动件直接退化成呼吸
      if (group === 'hold' && SHAKE.hold[key] && PV.S.plan && PV.S.plan.camera &&
          SHAKE.camera[PV.S.plan.camera.key] && PV.S.plan.camera.key !== 'none') {
        var soft = PV.part('hold', 'breathe');
        return soft && soft.apply ? soft.apply(c, target) : null;
      }
      var r = raw(c, target);
      return r;
    };
  }
  Object.keys(SHAKE.camera).forEach(function (k) { wrap('camera', k); });
  Object.keys(SHAKE.hold).forEach(function (k) { wrap('hold', k); });
  PV.MOTION_BUDGET = { moveMax: function () { return PV.moveMax; }, shake: SHAKE };
})();

})();
</script>
