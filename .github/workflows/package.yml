name: Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验清单
        run: |
          set -e
          echo "manifest:"
          cat manifest.json | head -20
          test -f index.js
          test -f ui/index.html
          test -f ui/_build.json
          test -f manifest.json

      - name: 打包
        run: |
          set -e
          # 目录名必须一字不差等于 manifest.id —— 这是 Hana 的安装合同。
          ID=$(grep -oP '"id"\s*:\s*"\K[^"]+' manifest.json | head -1)
          VER=$(grep -oP '"version"\s*:\s*"\K[^"]+' manifest.json | head -1)
          echo "id=$ID version=$VER"
          mkdir -p "dist/$ID"
          # 只带运行需要的东西：文档、本地数据、凭据一律不进包
          rsync -a \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='node_modules' \
            --exclude='LICENSE' \
            --exclude='SECURITY.md' \
            --exclude='CONTRIBUTING.md' \
            --exclude='COMMERCIAL-LICENSE.md' \
            --exclude='*.env' \
            --exclude='*.bak' \
            --exclude='*.bak-*' \
            --exclude='*.log' \
            ./ "dist/$ID/"
          cd dist && zip -qr "$ID-$VER.zip" "$ID"
          echo "--- 产物 ---"
          ls -la
          unzip -l "$ID-$VER.zip" | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hanako-audio-player-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
