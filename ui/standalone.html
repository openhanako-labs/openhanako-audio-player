.jv-justified .jv-w { font-size: 28px; font-weight: 700; flex: 1 0 auto; text-align: center; }
.jv-justified .jv-w:first-child { font-size: 38px; font-weight: 900; }

/* 9 框中框 */
.jv-framebox { display: block; }
.jv-framebox .fb2 {
  height: 100%; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--jv-acc); padding: 14px;
}
.jv-framebox .fb1 {
  border: 1px solid color-mix(in srgb, var(--jv-fg) 55%, transparent);
  padding: 22px 30px; font-size: 28px; font-weight: 800; text-align: center; line-height: 1.3;
}

/* 10 气泡 */
.jv-bubble { align-items: flex-start; padding-top: 14%; }
.jv-bubble .bub {
  position: relative; max-width: 74%; padding: 18px 26px;
  background: color-mix(in srgb, var(--jv-acc) 14%, transparent);
  border: 2px solid var(--jv-acc); border-radius: 26px 26px 26px 6px;
  font-size: 27px; font-weight: 700; line-height: 1.35;
}
.jv-bubble .bubtail {
  position: absolute; left: 22px; bottom: -14px; width: 0; height: 0;
  border: 7px solid transparent; border-top-color: var(--jv-acc); border-bottom: 0;
}

/* 11 跑马 */
.jv-ticker { justify-content: flex-start; }
.jv-ticker .tick { width: 100%; overflow: hidden; border-block: 1px solid color-mix(in srgb, var(--jv-fg) 30%, transparent); padding: 10px 0; }
.jv-ticker .tickrun { display: inline-flex; gap: 40px; white-space: nowrap; animation: jvTick 16s linear infinite; font-size: 30px; font-weight: 800; }
.jv-ticker .jv-w { margin-right: 26px; }
@keyframes jvTick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* 13 镜像 */
.jv-mirror { align-items: flex-start; padding-top: 20%; }
.jv-mirror .mir {
  font-size: 34px; font-weight: 900; text-align: center;
  -webkit-box-reflect: below 4px linear-gradient(transparent 46%, rgba(0, 0, 0, .32));
  box-reflect: below 4px linear-gradient(transparent 46%, rgba(0, 0, 0, .32));
}

/* 14 横倒 */
.jv-sideways { display: block; }
.jv-sideways .side90 {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center; white-space: nowrap; font-size: 32px; font-weight: 800;
}

/* 15 点阵 */
.jv-dotmatrix { display: block; }
.jv-dotmatrix .dm {
  height: 100%; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
  gap: 6px 14px; font-family: 'Consolas', 'Cascadia Mono', monospace; font-size: 30px; font-weight: 700;
}
.jv-dotmatrix .jv-w { border-bottom: 3px dotted color-mix(in srgb, var(--jv-acc) 70%, transparent); }

/* 16 双栏 */
.jv-columns { display: block; }
.jv-columns .cols2 {
  height: 100%; column-count: 2; column-gap: 34px; column-rule: 1px solid color-mix(in srgb, var(--jv-fg) 22%, transparent);
  align-content: center; font-size: 25px; font-weight: 600; line-height: 1.6; padding: 36px 8px;
}

/* 17 拼贴 */
.jv-ransom { display: block; }
.jv-ransom { align-content: center; justify-content: center; flex-wrap: wrap; padding: 34px; }
.jv-ransom .jv-w { display: inline-block; padding: 3px 9px; margin: 4px 3px; font-weight: 900; font-size: 27px; }
.jv-ransom .rn0 { background: var(--jv-acc); color: var(--jv-bg); font-family: Georgia, serif; }
.jv-ransom .rn1 { background: var(--jv-fg); color: var(--jv-bg); font-family: 'Consolas', monospace; }
.jv-ransom .rn2 { border: 2px solid var(--jv-fg); font-family: Impact, 'Microsoft YaHei', sans-serif; }
.jv-ransom .rn3 { background: color-mix(in srgb, var(--jv-acc) 30%, transparent); font-style: italic; }

/* 20 场记板 */
.jv-clapper { display: block; justify-content: center; }
.jv-clapper .clap { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
.jv-clapper .clapbar {
  width: 74%; height: 30px;
  background: repeating-linear-gradient(115deg, var(--jv-fg) 0 26px, var(--jv-bg) 26px 52px);
  transform: rotate(-3deg);
}
.jv-clapper .claptxt { font-size: 34px; font-weight: 900; letter-spacing: .04em; text-align: center; }
.jv-clapper .clapmeta { font-family: 'Consolas', monospace; font-size: 12px; letter-spacing: .28em; opacity: .6; }

/* 21 胶片 */
.jv-filmstrip { display: block; }
.jv-filmstrip .fs { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.jv-filmstrip .fstxt { text-align: center; font-size: 28px; font-weight: 700; line-height: 1.4; }
.jv-filmstrip .fsperf {
  height: 20px; background:
    repeating-linear-gradient(90deg, transparent 0 16px, color-mix(in srgb, var(--jv-fg) 45%, transparent) 16px 30px);
  background-size: auto 8px; background-repeat: repeat-x; background-position: center;
}

/* 22 警示 */
.jv-hazard { display: block; }
.jv-hazard .hz { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; }
.jv-hazard .hzstrip { width: 70%; height: 16px; background: repeating-linear-gradient(45deg, var(--jv-acc) 0 14px, var(--jv-bg) 14px 28px); }
.jv-hazard .hzstrip.b { transform: scaleX(-1); }
.jv-hazard .hztxt {
  font-size: 30px; font-weight: 900; letter-spacing: .1em; text-align: center;
  border: 3px solid var(--jv-fg); padding: 14px 26px;
}

/* PV 引擎 · 舞台附件样式 */

.jv-tag {
  position: absolute; top: 10px; left: 12px; z-index: 30;
  font-family: monospace; font-size: 9px; letter-spacing: .12em;
  color: var(--jv-fg); opacity: .55;
  /* 默认整个件都不显示（PV.tagOn=false，按 T 唤出）。显示时也不抢交互：
   * 上一版给了它 pointer-events:auto 当按钮，既然改成按键开关，就不该再有个隐形热区 */
  pointer-events: none;
  transition: opacity .5s ease;
}
/* 开着时闲一会儿就再淡一点：别抢看词 */
.jv-tag.dim { opacity: .22; }

.jv-dice {
  position: absolute; top: 10px; right: 12px; z-index: 30;
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--jv-acc, #D4AF37);
  background: rgba(0, 0, 0, .35); color: var(--jv-acc, #D4AF37);
  font-size: 15px; cursor: pointer; display: grid; place-items: center;
  transition: transform .4s cubic-bezier(.34, 1.56, .64, 1);
  backdrop-filter: blur(4px);
}
.jv-dice:hover { transform: rotate(120deg) scale(1.1); }
.jv-dice:active { transform: rotate(360deg) scale(.92); }

.jv-ghost {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 2;
  font-size: 13px; letter-spacing: .05em; color: var(--jv-fg); opacity: .5;
  pointer-events: none; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis;
}
.jv-ghost.up { top: 12%; }
.jv-ghost.dn { bottom: 12%; }

.jv-bar {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
  display: flex; gap: 6px; padding: 6px 10px;
  background: rgba(0, 0, 0, .35); border-radius: 16px; backdrop-filter: blur(4px);
}
.jv-dot {
  width: 14px; height: 14px; border-radius: 50%; cursor: pointer; padding: 0;
  border: 1.5px solid var(--d-acc);
  background: linear-gradient(135deg, var(--d-bg) 45%, var(--d-acc));
  transition: transform .15s;
}
.jv-dot:hover { transform: scale(1.3); }
.jv-dot.on { box-shadow: 0 0 0 2px var(--jv-bg), 0 0 0 3.5px var(--d-acc); }

/* 粒子层（decor/particles） */
.jv-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.jv-particles i {
  position: absolute; border-radius: 50%; background: var(--jv-acc); opacity: 0;
  animation: jvFloat linear infinite;
}
.jv-particles i.sq { border-radius: 1px; background: none; border: 1px solid var(--jv-acc); }
@keyframes jvFloat {
  0% { transform: translateY(30px) rotate(0deg); opacity: 0; }
  15% { opacity: .28; }
  80% { opacity: .22; }
  100% { transform: translateY(-70px) rotate(160deg); opacity: 0; }
}

/* PV 引擎 · ② 新增部件用的样式
 * 切片退场、白闪、HUD、引线、纹理层。全部 pointer-events:none，不吃交互。
 */

/* --- exit: slice 切片错位 --- */
.jv-slice {
  position: absolute; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; pointer-events: none;
  writing-mode: horizontal-tb;     /* 别继承竖写版式的书写方向 */
}

/* --- transition: flash 白闪 --- */
.jv-flash {
  position: absolute; inset: 0; z-index: 40; pointer-events: none;
  background: var(--jv-fg); opacity: .85; mix-blend-mode: screen;
}
.jv-flash.hard { background: var(--jv-acc); mix-blend-mode: lighten; }

/* --- decor: hud 边角 --- */
.jv-hud {
  position: absolute; right: 5%; bottom: 8%; z-index: 3;
  display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
  font-family: monospace; font-size: 9px; letter-spacing: .18em;
  color: var(--jv-fg); opacity: .42; pointer-events: none;
  writing-mode: horizontal-tb;     /* 竖写版式里不加这条，HUD 会跟着竖排 */
}
.jv-hud .no { color: var(--jv-acc); opacity: .9; }

/* --- decor: rule 左右引线 --- */
.jv-rules { position: absolute; inset: 0; pointer-events: none; }
.jv-rules i {
  position: absolute; top: 50%; width: 8%; height: 1px; background: var(--jv-acc); opacity: .55;
}
.jv-rules i:first-child { left: 4%; }
.jv-rules i:last-child { right: 4%; }

/* --- treatment: chroma 色偏残影 --- */
.jv-ghostA, .jv-ghostB { pointer-events: none; z-index: 1; }

/* --- treatment: grain 纹理（扫描线 + 纸纹 + 边角暗角） --- */
.jv-texture {
  position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: .2;
  background-image:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(0, 0, 0, .5) 100%);
  mix-blend-mode: overlay;
}

/* 层内元素给镜头留出变形空间：不要让行自己占满再叠 transform */
.jv-line { transform-origin: 50% 50%; }
.jv-w { transform-origin: 50% 50%; }
.jv-t { transform-origin: 50% 50%; }

/* PV 引擎 · ⑤ 装饰与处理扩容用的样式
 * 规矩：.jv-d（段内装饰，随 .jv-line 生灭）、.jv-t（整屏处理，挂在 #pvJv）。
 * 全部 horizontal-tb + pointer-events:none —— 竖写版式会把子层的文字方向一起带走（①踩过）。
 */

.jv-d, .jv-fx { pointer-events: none; writing-mode: horizontal-tb; }
.jv-d { position: absolute; inset: 0; z-index: 1; }
.jv-d > * { position: absolute; }
/* 整屏处理层叫 .jv-fx 不叫 .jv-t——.jv-t 从 ② 开始就是逐字 token 的类名，
 * 重名会把每个字拉成绝对定位铺满舞台（体检拓出来的，⑤ 自己埋的雷）。 */
.jv-fx { position: absolute; inset: 0; z-index: 6; }

/* ---------- decor ---------- */
.jv-frame .e { inset: 4.5% 5%; border: 1px solid var(--jv-fg); opacity: .35; }
.jv-frame .e2 { inset: 6.6% 7.2%; border: 1px solid var(--jv-acc); opacity: .5; }
.jv-frame .c { width: 13px; height: 13px; border: 2px solid var(--jv-acc); opacity: .8; }
.jv-frame .c.tl { left: 3.4%; top: 3.4%; border-right: 0; border-bottom: 0; }
.jv-frame .c.tr { right: 3.4%; top: 3.4%; border-left: 0; border-bottom: 0; }
.jv-frame .c.bl { left: 3.4%; bottom: 3.4%; border-right: 0; border-top: 0; }
.jv-frame .c.br { right: 3.4%; bottom: 3.4%; border-left: 0; border-top: 0; }

.jv-ticks { position: absolute; inset: auto 0 auto 0; top: 5.5%; height: 16px; display: flex; gap: 3px; justify-content: center; align-items: flex-start; }
.jv-ticks > i { position: static; width: 1px; background: var(--jv-fg); }

.jv-target svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.jv-target circle { fill: none; stroke: var(--jv-acc); stroke-width: .7; opacity: .3; }
.jv-target line { stroke: var(--jv-acc); stroke-width: 1; opacity: .5; }
.jv-target .co { fill: var(--jv-fg); font-family: monospace; font-size: 9px; opacity: .4; letter-spacing: .1em; }

/* 条码：从「整块硬边竖条墙」收成一个边缘渐隐的小饰条。高度不再吃满 46%，
 * 条高由 JS 逐根随机；mask 把上下左右抹掉，不然矩形边界本身就是那根「竖线」。 */
.jv-barcode { inset: auto; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; align-items: flex-end; height: 24%;
  -webkit-mask-image: radial-gradient(120% 130% at 50% 50%, #000 46%, transparent 86%);
  mask-image: radial-gradient(120% 130% at 50% 50%, #000 46%, transparent 86%); }
.jv-barcode.l { left: 3.5%; }
.jv-barcode.r { right: 3.5%; }
.jv-barcode > i { position: static; background: var(--jv-fg); }

.jv-arrows { display: flex; gap: 12px; align-items: center; color: var(--jv-acc); font-size: 15px; inset: auto; }
.jv-arrows.top { top: 12%; left: 50%; transform: translateX(-50%); }
.jv-arrows.bot { bottom: 12%; left: 50%; transform: translateX(-50%); }
.jv-arrows > span { position: static; animation: jvArrow 1.5s ease-in-out infinite; }
@keyframes jvArrow { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }

.jv-spark > i { background: var(--jv-acc); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: jvSpark 2.6s ease-in-out infinite; }
@keyframes jvSpark { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); } 45% { opacity: .85; transform: scale(1) rotate(45deg); } }

.jv-grid { position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .18;
  background-image: linear-gradient(to right, color-mix(in srgb, var(--jv-fg) 22%, transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb, var(--jv-fg) 22%, transparent) 1px, transparent 1px);
  background-size: 46px 46px; }

.jv-stripes > i { inset: 0; opacity: .1;
  background: repeating-linear-gradient(115deg, var(--jv-acc) 0 2px, transparent 2px 16px); }

.jv-bignum { display: flex; align-items: center; justify-content: center; font-size: min(30vh, 26vw); font-weight: 900; color: var(--jv-fg); opacity: .07; line-height: .8; letter-spacing: -.04em; overflow: hidden; }

.jv-ink > i { background: var(--jv-fg); border-radius: 50% 46% 52% 48% / 52% 48% 54% 46%; filter: blur(.4px); }

.jv-note { inset: auto; left: 50%; bottom: 12%; transform: translateX(-50%); font-size: 12px; letter-spacing: .22em; color: var(--jv-fg); opacity: .55; font-family: monospace; max-width: 74%; text-align: center; }

.jv-prog { inset: auto 0 6% 0; height: 2px; }
.jv-prog > i { position: static; display: block; width: 100%; height: 100%; background: var(--jv-acc); transform-origin: 0 50%; transform: scaleX(0); }

.jv-wave-band { display: flex; align-items: flex-end; gap: 3px; height: 16%; justify-content: center; inset: auto; }
.jv-wave-band.bot { left: 0; right: 0; bottom: 5%; }
.jv-wave-band.top { left: 0; right: 0; top: 5%; align-items: flex-start; }
.jv-wave-band > i { position: static; width: 3px; height: 100%; background: var(--jv-acc); transform-origin: 50% 100%; transform: scaleY(.1); }
.jv-wave-band.top > i { transform-origin: 50% 0; }

.jv-corner .pg { bottom: 7%; right: 6%; font-family: monospace; font-size: 10px; letter-spacing: .2em; color: var(--jv-fg); opacity: .45; }
.jv-corner .vt { top: 8%; right: 5.5%; writing-mode: vertical-rl; font-size: 11px; letter-spacing: .3em; color: var(--jv-acc); opacity: .5; max-height: 46%; overflow: hidden; }

/* ---------- treatment ---------- */
.jv-scan { background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .07) 0 1px, transparent 1px 4px); animation: jvScan 7s linear infinite; mix-blend-mode: overlay; }
@keyframes jvScan { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }

.jv-vig { background: radial-gradient(115% 88% at 50% 46%, transparent 46%, rgba(0, 0, 0, .62) 100%); transition: opacity .2s linear; }

.jv-punch { background: color-mix(in srgb, var(--jv-fg) 55%, transparent); mix-blend-mode: screen; opacity: 0; transition: opacity .09s linear; }

.jv-edge { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--jv-acc) 60%, transparent), inset 0 0 70px color-mix(in srgb, var(--jv-acc) 45%, transparent); }

.jv-gbars > i { left: 0; right: 0; background: var(--jv-acc); mix-blend-mode: screen; opacity: 0; }

.jv-duo { background: linear-gradient(150deg, color-mix(in srgb, var(--jv-acc) 70%, #0ff), color-mix(in srgb, var(--jv-acc) 55%, #f08)); mix-blend-mode: color; }

.jv-dust { opacity: .2; }
.jv-dust > i { background: var(--jv-fg); border-radius: 50%; animation: jvDust linear infinite; }
@keyframes jvDust { 0% { transform: translateY(6px); opacity: 0; } 20% { opacity: .5; } 80% { opacity: .35; } 100% { transform: translateY(-26px); opacity: 0; } }

/* ---------- transition ---------- */
.jv-trail { opacity: .5; pointer-events: none; mix-blend-mode: screen; }
.jv-slice-in { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 36px; pointer-events: none; }

/* PV 引擎 · ⑬ 装饰扩充样式（21 件，与 pv/src/25-decor2.js 一一对应）
 * 全部 .jv-d 已在 decor.css 里钉了 writing-mode:horizontal-tb 与 z-index，
 * 这里只画形状。颜色一律从 --jv-fg / --jv-acc 混出来，跟风格条走，不写死色值。
 */

/* 根因：.jv-d 基类是 inset:0（四边钉住）。只写 left/bottom 的话，
 * 另两边还是 0 → 元素被拉满整块舞台（实测“正字计数”975×102、“时间码”横贯全宽）。
 * ⑤ 就是靠 `inset:auto` 治过这个，这批新件又漏了——一次性在开头写清。*/
/* 角落件的正确摆法（⑬ 修过一次又错了一次）：
 *  `.jv-d` 基类是 inset:0（四边钉死）。只写 left/bottom 时另两边仍是 0 → 被拉成满幅；
 *  但改成 `inset:auto` 也不对：在 flex 容器（.jv-line 是 flex）里，
 *  只给单边的绝对定位元素会退回**静态位置**，而静态位置按 flex 对齐算 = 居中
 *  ——实测落款离右边 466px、下边 254px，印就压在正文上。
 *  所以：容器始绠保持 inset:0 当满幅框架，可见的东西给子元素，由框架的 flex 推到角。*/
.jv-d.jv-seal, .jv-d.jv-timecode, .jv-d.jv-datestamp, .jv-d.jv-tally,
.jv-d.jv-swatches, .jv-d.jv-dimline {
  inset: 0;
  display: flex;
}
.jv-d.jv-seal      { justify-content: flex-end; align-items: flex-end; padding: 0 3.5% 5% 0; }
.jv-d.jv-timecode  { justify-content: flex-end; align-items: flex-start; padding: 12px 14px 0 0; }
.jv-d.jv-datestamp { justify-content: flex-end; align-items: flex-end; padding: 0 16px 14px 0; }
.jv-d.jv-tally     { justify-content: flex-start; align-items: flex-end; padding: 0 0 16px 16px; }
.jv-d.jv-swatches  { justify-content: flex-end; align-items: flex-end; padding: 0 14px 14px 0; }
.jv-d.jv-dimline   { justify-content: flex-start; align-items: flex-start; padding: 12% 0 0 10%; }

/* 以上六件的样式都在 > i 上，容器只负责定位 */
.jv-seal > i {
  width: 38px; height: 38px; display: grid; place-items: center;
  border: 2px solid color-mix(in srgb, var(--jv-acc) 55%, #c0392b);
  border-radius: 6px; font-style: normal;
  color: color-mix(in srgb, var(--jv-acc) 55%, #c0392b);
  font-size: 20px; font-weight: 800;
  background: color-mix(in srgb, var(--jv-acc) 9%, transparent);
  transform: rotate(-6deg); opacity: .6;
}

.jv-d.jv-crop, .jv-d.jv-regmark, .jv-d.jv-swatches, .jv-d.jv-tally,
.jv-d.jv-dimline, .jv-d.jv-ruler, .jv-d.jv-guides, .jv-d.jv-timecode,
.jv-d.jv-datestamp, .jv-d.jv-tape, .jv-d.jv-circline, .jv-d.jv-scribble,
.jv-d.jv-brackets, .jv-d.jv-seal, .jv-d.jv-leak, .jv-d.jv-burstlines,
.jv-d.jv-sqrings, .jv-d.jv-plusgrid, .jv-d.jv-checker, .jv-d.jv-hanzi,
.jv-d.jv-notes, .jv-d.jv-ruled { position: absolute; pointer-events: none; }

/* ---- 纸面与印张 ---- */
.jv-crop { inset: 0; }
.jv-crop > i { position: absolute; width: 26px; height: 26px; border: 1px solid color-mix(in srgb, var(--jv-fg) 55%, transparent); }
.jv-crop > i:nth-child(1) { left: 12px; top: 12px; border-right: 0; border-bottom: 0; }
.jv-crop > i:nth-child(2) { right: 12px; top: 12px; border-left: 0; border-bottom: 0; }
.jv-crop > i:nth-child(3) { left: 12px; bottom: 12px; border-right: 0; border-top: 0; }
.jv-crop > i:nth-child(4) { right: 12px; bottom: 12px; border-left: 0; border-top: 0; }

.jv-regmark { left: 16px; bottom: 16px; width: 46px; height: 46px; opacity: .5; }
.jv-regmark > i { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 1px solid var(--jv-fg); }
.jv-regmark > i.b { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-color: var(--jv-acc); }
.jv-regmark::after { content: ''; position: absolute; inset: 0; background: linear-gradient(var(--jv-fg), var(--jv-fg)) 50% 0/1px 100% no-repeat, linear-gradient(var(--jv-fg), var(--jv-fg)) 0 50%/100% 1px no-repeat; }

.jv-ruled { left: 5%; right: 5%; top: 18%; bottom: 18%; opacity: .16;
  background: repeating-linear-gradient(to bottom, transparent 0 33px, color-mix(in srgb, var(--jv-fg) 60%, transparent) 33px 34px); }

.jv-swatches { right: 14px; bottom: 14px; display: flex; gap: 3px; opacity: .8; }
.jv-swatches > i { width: 15px; height: 8px; background: var(--jv-fg); }
.jv-swatches > i:nth-child(odd) { background: var(--jv-acc); }

.jv-tally { left: 16px; bottom: 16px; display: flex; gap: 5px; align-items: flex-end; height: 30px; opacity: .55; }
.jv-tally > i { width: 3px; height: 100%; background: var(--jv-fg); }
.jv-tally > i:nth-child(5) { position: absolute; left: -2px; top: 50%; width: 30px; height: 3px; transform: rotate(-24deg); }

/* ---- 标注与测量 ---- */
.jv-dimline { left: 10%; top: 12%; height: 16px; display: flex; align-items: center; opacity: .55; }
.jv-dimline > .bar { position: static; height: 1px; background: var(--jv-fg); }
.jv-dimline > .cap { position: static; width: 1px; height: 12px; background: var(--jv-fg); }
.jv-dimline > span { position: static; font-family: monospace; font-size: 9px; letter-spacing: .1em; margin-left: 6px; color: var(--jv-acc); }

.jv-ruler { left: 0; right: 0; top: 10px; height: 16px; display: flex; gap: 5px; align-items: flex-end; opacity: .38; }
.jv-ruler > i { flex: 1; background: color-mix(in srgb, var(--jv-fg) 70%, transparent); max-width: 2px; }

.jv-guides { inset: 0; opacity: .3; }
.jv-guides > .v { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--jv-acc) 60%, transparent); }
.jv-guides > .v.a { left: 33.33%; } .jv-guides > .v.b { left: 66.66%; }
.jv-guides > .h { position: absolute; left: 0; right: 0; height: 1px; background: color-mix(in srgb, var(--jv-acc) 60%, transparent); }
.jv-guides > .h.a { top: 33.33%; } .jv-guides > .h.b { top: 66.66%; }

.jv-timecode {
  font-family: monospace; font-size: 10px; letter-spacing: .18em;
  color: var(--jv-acc); border: 1px solid color-mix(in srgb, var(--jv-acc) 45%, transparent);
  padding: 2px 7px; font-style: normal;
}

.jv-datestamp { font-family: 'Consolas', monospace; font-size: 13px; letter-spacing: .14em;
  color: color-mix(in srgb, var(--jv-acc) 80%, #f60); opacity: .85; text-shadow: 0 0 6px currentColor; font-style: normal; }

/* ---- 手绘与贴纸 ---- */
/* 胶带：容器推到角，内层负责斜放（和落款同一套框架模型）*/
.jv-d.jv-tape { inset: 0; display: flex; }
.jv-tape.tl { justify-content: flex-start; align-items: flex-start; padding: 16% 0 0 10%; }
.jv-tape.br { justify-content: flex-end; align-items: flex-end; padding: 0 10% 18% 0; }
.jv-tape > div { position: relative; width: 92px; height: 26px; opacity: .8; }
.jv-tape > div > i { position: absolute; inset: 0; background: color-mix(in srgb, var(--jv-acc) 34%, transparent);
  border-inline: 2px dashed color-mix(in srgb, var(--jv-acc) 60%, transparent); }
.jv-tape > div > i:nth-child(2) { transform: translateY(3px) rotate(2deg); opacity: .5; }

/* 六件的可见部分一律在子节点上，容器只管把东西推到角 */
.jv-tally > div { display: flex; gap: 5px; align-items: flex-end; height: 30px; }
.jv-tally > div > i { width: 3px; height: 100%; background: var(--jv-fg); }
.jv-swatches > div { display: flex; gap: 3px; }
.jv-swatches > div > i { width: 15px; height: 8px; background: var(--jv-fg); }
.jv-swatches > div > i:nth-child(odd) { background: var(--jv-acc); }
.jv-dimline > div { display: flex; align-items: center; width: 34%; opacity: .55; }
.jv-dimline .bar { height: 1px; background: var(--jv-fg); }
.jv-dimline .cap { width: 1px; height: 12px; background: var(--jv-fg); }
.jv-dimline b { font-family: monospace; font-size: 9px; letter-spacing: .1em; margin-left: 6px;
  color: var(--jv-acc); font-weight: 400; }

.jv-circline { left: 50%; top: 50%; width: 62%; height: 46%; transform: translate(-50%, -50%);
  border: 2px solid color-mix(in srgb, var(--jv-acc) 70%, transparent);
  border-radius: 48% 52% 45% 55% / 56% 44% 58% 42%; opacity: .55; }

.jv-scribble { left: 12%; right: 12%; height: 12px; opacity: .7; }
.jv-scribble.under { bottom: 20%; } .jv-scribble.through { top: 50%; }
.jv-scribble svg { width: 100%; height: 12px; }
.jv-scribble path { fill: none; stroke: var(--jv-acc); stroke-width: 2.4; stroke-linecap: round; }

.jv-brackets { inset: 0; }
.jv-brackets > i { position: absolute; font-style: normal; font-size: 46px; font-weight: 700;
  color: color-mix(in srgb, var(--jv-fg) 65%, transparent); }
.jv-brackets > i:first-child { left: 6%; top: 22%; }
.jv-brackets > i:last-child { right: 6%; bottom: 22%; }

/* 落款：印色不写死（本文件开头就定了“全用 fg/acc 混”），
 * 从 acc 往暖红方向推一点——保留印章感又不和风格打架。
 * 位置收到真正的角落、z-index 低于 token，不再压在正文上。*/
.jv-seal {
  right: 3.5%; bottom: 6%; width: 38px; height: 38px; z-index: 0;
  display: grid; place-items: center;
  border: 2px solid color-mix(in srgb, var(--jv-acc) 60%, #c0392b);
  border-radius: 6px;
  color: color-mix(in srgb, var(--jv-acc) 60%, #c0392b);
  font-size: 20px; font-weight: 800;
  background: color-mix(in srgb, var(--jv-acc) 10%, transparent);
  transform: rotate(-6deg); opacity: .62;
}

/* ---- 光与几何 ---- */
.jv-leak { inset: 0; mix-blend-mode: screen; opacity: .5; }
.jv-leak.l { background: radial-gradient(60% 90% at 0% 30%, color-mix(in srgb, var(--jv-acc) 55%, #ff9), transparent 62%); }
.jv-leak.r { background: radial-gradient(60% 90% at 100% 70%, color-mix(in srgb, var(--jv-acc) 55%, #f9a), transparent 62%); }

/* 放射线：容器不能是 0x0 的“原点”——子条写百分比宽度时，
 * 百分比对零尺寸父级求值就是 0，整件东西根本画不出来（实测 33 根全 0x2）。
 * 给它一个真尺寸，旋转原点仍然放在锁定的那个角上。*/
.jv-burstlines { width: 44%; height: 52%; }
.jv-burstlines.tl { left: 0; top: 0; }
.jv-burstlines.br { right: 0; bottom: 0; }
.jv-burstlines > i { position: absolute; left: 50%; top: 50%; width: 50%; height: 2px; transform-origin: 0 50%;
  background: linear-gradient(90deg, color-mix(in srgb, var(--jv-fg) 55%, transparent), transparent); }

/* 同心方：同理，容器得给真尺寸（原来 1px×1px，子块的 18% 就是 0.18px）*/
.jv-sqrings { left: 50%; top: 50%; width: 56%; height: 62%; transform: translate(-50%, -50%); }
.jv-sqrings > i { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  border: 1px solid color-mix(in srgb, var(--jv-acc) 40%, transparent); }

/* 加号阵：两条细线在一个单元格内交叉，平铺出来就是一排排 +。
 * （写成两条规则会前一条死掉——之就刚写过一份被自己盖掉的废规则）*/
.jv-plusgrid { inset: 0; opacity: .3;
  --pl: color-mix(in srgb, var(--jv-fg) 55%, transparent);
  background-image:
    linear-gradient(to right, transparent calc(50% - .5px), var(--pl) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to bottom, transparent calc(50% - .5px), var(--pl) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px));
  background-size: 34px 34px; }

.jv-checker { left: 0; right: 0; height: 22px; opacity: .35;
  background: repeating-conic-gradient(color-mix(in srgb, var(--jv-fg) 55%, transparent) 0 25%, transparent 0 50%) 0 0/22px 22px; }
.jv-checker.top { top: 0; } .jv-checker.bot { bottom: 0; }

.jv-hanzi { inset: 0; display: grid; place-items: center; font-size: min(46vh, 40vw); font-weight: 900;
  color: var(--jv-fg); opacity: .06; line-height: 1; letter-spacing: -.04em; }

.jv-notes { inset: 0; }
.jv-notes > i { position: absolute; font-style: normal; color: color-mix(in srgb, var(--jv-acc) 80%, var(--jv-fg));
  animation: jvNoteFloat 3.4s ease-in-out infinite; }
@keyframes jvNoteFloat {
  0%, 100% { transform: translateY(0) rotate(-6deg); opacity: .35; }
  50% { transform: translateY(-14px) rotate(8deg); opacity: .9; }
}

/* PV 引擎 · ⑥ 字体层样式
 * 两个变量：--jv-face（本段的主字体栈）、--jv-mono（等宽，打字版式与小字用）。
 * 版式自带的 letter-spacing 比这里更具体，会盖过字体自带的字距——这是故意的：
 * 竖写要 .35em、纵压要 .14em，那些是版式的形状，不该被字体拽回去。
 */

.jv-line { font-family: var(--jv-face, inherit); }
.jv-line .cur, .jv-line .bandrow, .jv-line .capbar, .jv-line .pl, .jv-line .sk,
.jv-line .cd, .jv-line .dt, .jv-line .ct, .jv-line .tagbox, .jv-line .tt,
.jv-line .big, .jv-line .sm, .jv-line .prev, .jv-line .next {
  font-weight: var(--jv-face-weight, inherit);
}

/* 打字版式永远等宽，不参与字体抽签 */
.jv-type, .jv-type .jv-w, .jv-type .jv-t { font-family: var(--jv-mono, monospace); }

/* 注釈 / HUD / 刻度 / 页角 / 底纹数字这类小字要可读，也别用行楷 */
.jv-note, .jv-hud, .jv-ticks, .jv-corner .pg, .jv-bignum {
  font-family: var(--jv-mono, monospace);
  font-weight: 400;
}

/* PV 引擎 · ⑧ 背景层样式
 * .jv-bg-layer 只建一个，换件时靠 JS 抹旧属性——所以这里的动画名必须和 19-bg.js 里
 * 写的 animation 名一一对上，改了那边记得改这边。
 */

.jv-bg-layer {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
  background-repeat: repeat;
  transition: opacity .5s ease;
}

@keyframes jvBgBeam {
  0% { background-position: -60% 0; }
  100% { background-position: 160% 0; }
}
@keyframes jvBgZoom {
  0% { transform: scale(1); }
  100% { transform: scale(1.22); }
}
@keyframes jvBgScan {
  0% { background-position: 0 0; }
  100% { background-position: 0 40px; }
}
@keyframes jvBgDrift {
  0% { background-position: 0 0; }
  100% { background-position: 120px -180px; }
}
@keyframes jvBgHue {
  0%, 100% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(28deg); }
}

/* 扫光与同心圈要能真的动起来：background-position / transform 都得可动画 */
.jv-bg-layer[data-bg="beam"] { background-size: 220% 100%; }

/* PV 引擎 · ⑮ 背景扩充用的动画
 * 只给背景层用（.jv-bg-layer）。⑧ 的五个动画在 css/bg.css，这里补齐 ⑮ 新引用的六个。
 * 注意：background-position / transform / filter 这三类才可在背景层上安全动画——
 * 它只有一个节点，换件时 JS 会把属性抹掉，所以 animation 名必须和 27-bg2.js 一一对上。
 */

/* 摩尔纹：两层同心环错开位移，交叠处自然生出条纹 */
@keyframes jvBgMoire {
  0% { background-position: 0 0, 0 0; }
  100% { background-position: 46px 30px, -38px 22px; }
}

/* 方洞：从中心往外呼吸式放大 */
@keyframes jvBgTunnel {
  0% { transform: scale(1); opacity: .5; }
  100% { transform: scale(1.5); opacity: .9; }
}

/* 旋臂 / 万花筒：慢转与色相漂移 */
@keyframes jvBgSpinSlow {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* 光芒：摆角，不是整圈转 */
@keyframes jvBgRay {
  0% { transform: rotate(-7deg) scale(1.05); }
  100% { transform: rotate(7deg) scale(1.12); }
}

/* 极光：横向漂移 + 轻微伸缩，配合 screen 混合出流动感 */
@keyframes jvBgAurora {
  0% { background-position: -20% 0; transform: translateX(-6%) skewY(-1.2deg); }
  100% { background-position: 120% 0; transform: translateX(6%) skewY(1.2deg); }
}

/* VHS 带：一条横向亮带自上而下走过 + 底纹抖动 */
@keyframes jvBgVhs {
  0% { background-position: 0 0, 0 -40%; }
  100% { background-position: 0 0, 0 140%; }
}

/* PV 引擎 · ⑩ 字形外观层样式
 * 只作用在 i.jv-t 上（登场层的那个内层），只写涂装属性。
 * 幅度一律走 .pv-jv 上的 --lk-* 变量，由 21-looks.js 每件自己掷；
 * 变量没给时下面的 fallback 就是这件的默认长相。
 */

/* ---------- 描边族 ---------- */
.pv-jv[data-look="outline"] .jv-t,
.pv-jv[data-look="outlineFill"] .jv-t,
.pv-jv[data-look="doubleOutline"] .jv-t,
.pv-jv[data-look="dotted"] .jv-t,
.pv-jv[data-look="echoOutline"] .jv-t,
.pv-jv[data-look="stencil"] .jv-t {
  -webkit-text-stroke: var(--lk-sw, .05em) var(--jv-acc);
  color: var(--lk-fill, transparent);
  paint-order: stroke fill;
}
.pv-jv[data-look="doubleOutline"] .jv-t {
  text-shadow: var(--lk-ring, 3px) var(--lk-ring, 3px) 0 color-mix(in srgb, var(--jv-acc) 45%, transparent);
}
/* 点线缘：整字按横向节距切片，读起来就是虚线描的 */
.pv-jv[data-look="dotted"] .jv-t {
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 var(--lk-dash, 4px), transparent 0 calc(var(--lk-dash, 4px) * 2));
  mask-image: repeating-linear-gradient(90deg, #000 0 var(--lk-dash, 4px), transparent 0 calc(var(--lk-dash, 4px) * 2));
}
.pv-jv[data-look="echoOutline"] .jv-t {
  text-shadow:
    var(--lk-echo, 10px) var(--lk-echo, 10px) 0 color-mix(in srgb, var(--jv-acc) 22%, transparent),
    calc(var(--lk-echo, 10px) * -1) calc(var(--lk-echo, 10px) * -1) 0 color-mix(in srgb, var(--jv-acc) 14%, transparent);
}

/* ---------- 阴影族（方向由 --lk-dx/--lk-dy 给单位less 步长，CSS 乘 px） ---------- */
.pv-jv[data-look="extrude"] .jv-t {
  text-shadow:
    calc(var(--lk-dx, .7) * 1px) calc(var(--lk-dy, .7) * 1px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 2px) calc(var(--lk-dy, .7) * 2px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 3px) calc(var(--lk-dy, .7) * 3px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 4px) calc(var(--lk-dy, .7) * 4px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 5px) calc(var(--lk-dy, .7) * 5px) 0 var(--lk-sh),
    calc(var(--lk-dx, .7) * 6px) calc(var(--lk-dy, .7) * 6px) 0 var(--lk-sh2),
    calc(var(--lk-dx, .7) * 7px) calc(var(--lk-dy, .7) * 7px) 0 var(--lk-sh2),
    calc(var(--lk-dx, .7) * 8px) calc(var(--lk-dy, .7) * 8px) 3px rgba(0, 0, 0, .35);
}
.pv-jv[data-look="longShadow"] .jv-t {
  text-shadow:
    calc(var(--lk-dx, 1) * 1px) calc(var(--lk-dy, 1) * 1px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 2px) calc(var(--lk-dy, 1) * 2px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 3px) calc(var(--lk-dy, 1) * 3px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 4px) calc(var(--lk-dy, 1) * 4px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 5px) calc(var(--lk-dy, 1) * 5px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 6px) calc(var(--lk-dy, 1) * 6px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 7px) calc(var(--lk-dy, 1) * 7px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 8px) calc(var(--lk-dy, 1) * 8px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 9px) calc(var(--lk-dy, 1) * 9px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 10px) calc(var(--lk-dy, 1) * 10px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 11px) calc(var(--lk-dy, 1) * 11px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 12px) calc(var(--lk-dy, 1) * 12px) 0 var(--lk-sh3),
    calc(var(--lk-dx, 1) * 13px) calc(var(--lk-dy, 1) * 13px) 0 var(--lk-sh4),
    calc(var(--lk-dx, 1) * 14px) calc(var(--lk-dy, 1) * 14px) 4px var(--lk-sh4);
}
.pv-jv[data-look="hardShadow"] .jv-t {
  text-shadow: calc(var(--lk-dx, 3) * 1px) calc(var(--lk-dy, 3) * 1px) 0 color-mix(in srgb, var(--jv-acc) 85%, var(--jv-bg));
}
.pv-jv[data-look="softShadow"] .jv-t {
  text-shadow: 0 var(--lk-soft, .45em) var(--lk-soft, .45em) rgba(0, 0, 0, .55);
}
.pv-jv[data-look="glow"] .jv-t {
  text-shadow:
    0 0 calc(var(--lk-glow, .6em) * .4) color-mix(in srgb, var(--jv-acc) 80%, #fff),
    0 0 var(--lk-glow, .6em) var(--jv-acc),
    0 0 calc(var(--lk-glow, .6em) * 2) color-mix(in srgb, var(--jv-acc) 45%, transparent);
}

/* ---------- 填充族：一律 clip 到字上 ---------- */
.pv-jv[data-look="gradientV"] .jv-t,
.pv-jv[data-look="splitColor"] .jv-t,
.pv-jv[data-look="halftone"] .jv-t,
.pv-jv[data-look="stripes"] .jv-t,
.pv-jv[data-look="hatch"] .jv-t,
.pv-jv[data-look="stencil"] .jv-t {
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.pv-jv[data-look="gradientV"] .jv-t {
  background-image: linear-gradient(var(--lk-dir, 180deg), var(--jv-fg), color-mix(in srgb, var(--jv-acc) 75%, var(--jv-fg)));
}
.pv-jv[data-look="splitColor"] .jv-t {
  background-image: linear-gradient(180deg, var(--jv-fg) var(--lk-stop, 50%), var(--jv-acc) var(--lk-stop, 50%));
}
.pv-jv[data-look="halftone"] .jv-t {
  background-image: radial-gradient(var(--jv-fg) 0 var(--lk-dot, 4px), transparent var(--lk-dot, 4px));
  background-size: calc(var(--lk-dot, 4px) * 2.2) calc(var(--lk-dot, 4px) * 2.2);
}
.pv-jv[data-look="stripes"] .jv-t {
  background-image: repeating-linear-gradient(var(--lk-ang, 90deg), var(--jv-fg) 0 2px, transparent 2px var(--lk-pitch, 6px));
}
.pv-jv[data-look="hatch"] .jv-t {
  background-image: repeating-linear-gradient(48deg, var(--jv-fg) 0 1px, transparent 1px var(--lk-pitch, 3px));
}
/* 镂空：条纹填充 + 描边，中间再抹几道横杠 */
.pv-jv[data-look="stencil"] .jv-t {
  background-image: linear-gradient(var(--jv-fg), var(--jv-fg));
  -webkit-mask-image: repeating-linear-gradient(0deg, transparent 0 var(--lk-bar, 10px), #000 var(--lk-bar, 10px) calc(var(--lk-bar, 10px) + 2px));
  mask-image: repeating-linear-gradient(0deg, transparent 0 var(--lk-bar, 10px), #000 var(--lk-bar, 10px) calc(var(--lk-bar, 10px) + 2px));
}

/* ---------- 线与框族 ---------- */
.pv-jv[data-look="marker"] .jv-t {
  background-image: linear-gradient(transparent var(--lk-mk, 68%), color-mix(in srgb, var(--jv-acc) 55%, transparent) var(--lk-mk, 68%));
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.pv-jv[data-look="underline"] .jv-t {
  text-decoration: underline;
  text-decoration-thickness: var(--lk-ul, 3px);
  text-decoration-color: var(--jv-acc);
  text-underline-offset: .14em;
}
.pv-jv[data-look="strike"] .jv-t {
  text-decoration: line-through;
  text-decoration-thickness: .07em;
  text-decoration-color: var(--jv-acc);
}
.pv-jv[data-look="boxed"] .jv-t {
  display: inline-block;
  border: var(--lk-bw, 1.5px) solid var(--jv-acc);
  padding: var(--lk-pad, 4px) calc(var(--lk-pad, 4px) + 2px);
  background: color-mix(in srgb, var(--jv-acc) 12%, transparent);
}
/* 傍点：日文竖排着重号，CJK 原生特性，不需要素材 */
.pv-jv[data-look="emphasisDots"] .jv-t {
  text-emphasis: filled dot var(--jv-acc);
  -webkit-text-emphasis: filled dot var(--jv-acc);
  text-emphasis-position: over right;
}
.pv-jv[data-look="alternate"] .jv-w:nth-child(even) .jv-t { color: var(--jv-acc); }
.pv-jv[data-look="italic"] .jv-t { font-style: italic; }

/* 阴影色：主体压暗，末端更淡，全部从当前风格的 acc/bg 混出来，跟配色走 */
.pv-jv {
  --lk-sh: color-mix(in srgb, var(--jv-acc) 42%, var(--jv-bg));
  --lk-sh2: color-mix(in srgb, var(--jv-acc) 26%, var(--jv-bg));
  --lk-sh3: color-mix(in srgb, var(--jv-acc) 20%, var(--jv-bg));
  --lk-sh4: color-mix(in srgb, var(--jv-acc) 9%, var(--jv-bg));
}

/* PV 引擎 · ③续 真合成转场用到的自定义属性注册
 *
 * 时钟擦要动画 conic 遮罩的角度。CSS 只能动画**注册过**的自定义属性，
 * 未注册的 `--cwA` 在 WAAPI 里不会插值（会直接跳到终值），所以这里必须注册。
 * 不注册时的退化路径写在 31-trans2.js 里（走 steps 单向揭开），不会白屏。
 */
@property --cwA {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

/* conic 遮罩靠 --cwA 驱动：注册后 WAAPI 改 --cwA，mask-image 里的引用跟着走 */
.jv-line[data-cw="1"] {
  -webkit-mask-image: conic-gradient(from -90deg at 50% 50%, #000 var(--cwA), transparent 0);
  mask-image: conic-gradient(from -90deg at 50% 50%, #000 var(--cwA), transparent 0);
}

/* ===== PV:END ===== */

<script>
(function () {
'use strict';
var strip = document.getElementById('playerStrip');
if (!strip) return;
var player = document.querySelector('.player-container');
var cover = document.getElementById('stripCover');
var ringFill = document.querySelector('.strip-ring-fill');
var nameEl = document.getElementById('stripTitle');
var artistEl = document.getElementById('stripArtist');
var curEl = document.getElementById('stripCur');
var totalEl = document.getElementById('stripTotal');
var playBtn = document.getElementById('stripPlay');
var playIcon = document.getElementById('stripPlayIcon');
var pauseIcon = document.getElementById('stripPauseIcon');
var favBtn = document.getElementById('stripFav');
var lyricEl = document.getElementById('stripLyric');
var volBtn = document.getElementById('stripVolBtn');
var volSliderEl = document.getElementById('stripVolSlider2');

// ── 信封驱动断点 ──
var lastLayout = null;
function layoutFromEnvelope(env) {
  var w = null, h = null;
  try {
    if (env && env.width)  w = env.width.value != null ? env.width.value : (env.width.max != null ? env.width.max : null);
    if (env && env.height) h = env.height.value != null ? env.height.value : (env.height.max != null ? env.height.max : null);
  } catch (e) {}
  if (w == null) w = window.innerWidth || document.documentElement.clientWidth || 0;
  if (h == null) h = window.innerHeight || document.documentElement.clientHeight || 0;
  if (h <= 0 || w <= 0) return lastLayout || 'long';
  var next;
  if (h <= 156 && w >= h * 1.6) next = 'strip';
  else next = w >= 720 ? 'wide' : (h < 560 ? 'compact' : 'long');
  return next;
}
function syncStripHeight() {
  if (!strip) return;
  var isStrip = player && player.getAttribute('data-layout') === 'strip';
  if (!isStrip) return;
  var h = strip.getBoundingClientRect().height;
  if (!h || h <= 0) {
    requestAnimationFrame(syncStripHeight);
    return;
  }
  var capped = Math.min(64, Math.max(40, Math.round(h)));
  strip.style.setProperty('--strip-height', capped + 'px');
}

// ── 标题栏交互区域上报 ──
function reportInteractiveRegions() {
  try {
    var surf = window.__hana && window.__hana.surface;
    if (!surf || typeof surf.setInteractiveRegions !== 'function') return;
    var rects = [];
    var seen = 0;
    var all = document.querySelectorAll('button, [role="button"], input[type="range"], .nav-tab, .mc, .strip-btn, .icon-btn');
    all.forEach(function (b) {
      if (seen >= 60) return;
      var r = b.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) return;
      var cs = getComputedStyle(b);
      if (cs.visibility === 'hidden' || cs.display === 'none' || cs.opacity === '0') return;
      if (r.top > 160) return;
      rects.push({ x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height) });
      seen++;
    });
    var isStrip = player && player.getAttribute('data-layout') === 'strip';
    if (isStrip) {
      var btns = strip.querySelectorAll('.strip-btn');
      btns.forEach(function (b) {
        var r = b.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) rects.push({ x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height) });
      });
    }
    surf.setInteractiveRegions(rects);
  } catch (e) {}
}
window.addEventListener('resize', function () { syncStripHeight(); reportInteractiveRegions(); });
window.addEventListener('resize', function () { applyEnvelopeResize(); });
function applyEnvelopeResize() {
  var next = layoutFromEnvelope();
  if (next !== lastLayout) { lastLayout = next; if (player) player.setAttribute('data-layout', next); refresh(); }
  syncStripHeight(); reportInteractiveRegions();
}
try {
  if (window.__hana && window.__hana.envelope && window.__hana.envelope.subscribe) {
    window.__hana.envelope.subscribe(function (env) {
      var next = layoutFromEnvelope(env);
      if (next !== lastLayout) { lastLayout = next; if (player) player.setAttribute('data-layout', next); refresh(); }
      syncStripHeight(); reportInteractiveRegions();
    });

} catch (e) {}

// ── 悬停/聚焦交互态：指针进条/获焦显示控件 ──
function setActive(on) { strip.classList.toggle('active', on); }
strip.addEventListener('pointerenter', function () { setActive(true); });
strip.addEventListener('pointerleave', function () { setActive(false); });
strip.addEventListener('focusin', function () { setActive(true); });
strip.addEventListener('focusout', function (e) { if (!strip.contains(e.relatedTarget)) setActive(false); });

// ── 复用既有控件：派发 click，行为与竖卡一致 ──
function tap(id) { var el = document.getElementById(id); if (el) el.click(); }
playBtn.addEventListener('click', function () { tap('playBtn'); });
favBtn.addEventListener('click', function (e) { e.stopPropagation(); tap('favBtn'); });
volBtn.addEventListener('click', function (e) { e.stopPropagation(); tap('volumeBtn'); });
if (volSliderEl) {
  volSliderEl.addEventListener('input', function () {
    var a = document.getElementById('audio');
    var v = Number(volSliderEl.value);
    if (a) a.volume = v / 100;
    volSliderEl.style.setProperty('--vol', v + '%');
    var vs = document.getElementById('volumeSlider');
    if (vs && vs.value !== String(v)) vs.value = v;
  });
}

// ── 镜像竖卡状态：歌名/歌手/封面/播放态/收藏 ──
function setText(el, t) { if (el && el.textContent !== t) el.textContent = t; }
var lastCover = null;
function syncTrack() {
  var tn = document.getElementById('trackName');
  var tm = document.getElementById('trackMode');
  setText(nameEl, tn ? tn.textContent : '播放器');
  setText(artistEl, tm ? tm.textContent : '');
  var nc = document.getElementById('npCover');
  var img = nc ? nc.querySelector('img') : null;
  var src = img ? img.getAttribute('src') : null;
  if (src !== lastCover) {
    lastCover = src;
    cover.style.backgroundImage = src ? 'url("' + src.replace(/\"/g, '') + '")' : '';
    cover.classList.toggle('has-art', !!src);
    cover.setAttribute('aria-label', src ? '' : '显示播放控件');
  }
  var fv = document.getElementById('favBtn');
  favBtn.classList.toggle('is-accent', !!(fv && fv.classList && fv.classList.contains('is-accent')));
}
function syncPlay() {
  var audio = document.getElementById('audio');
  var playing = audio && !audio.paused;
  playIcon.style.display = playing ? 'none' : 'block';
  pauseIcon.style.display = playing ? 'block' : 'none';
}
function syncVol() {
  var audio = document.getElementById('audio');
  if (!audio) return;
  var vBtn = document.getElementById('volumeBtn');
  if (volSliderEl && audio.volume != null) {
    var v = Math.round(audio.volume * 100);
    if (Number(volSliderEl.value) !== v) volSliderEl.value = v;
    volSliderEl.style.setProperty('--vol', v + '%');
  }
  if (vBtn && vBtn.querySelector('svg')) {
    var dim = vBtn.querySelector('svg').style.opacity === '0.3';
    volBtn.style.opacity = dim ? '0.4' : '1';
  }
}

function syncLyric() {
  var lyr = document.getElementById('lyricBody');
  var cur = lyr ? lyr.querySelector('.lyric-line.current .l-main') : null;
  var txt = cur ? cur.textContent.trim() : '';
  if (!txt) {
    var pvLine = document.querySelector('.pv-line[data-d="0"]');
    txt = pvLine ? pvLine.textContent.trim() : '';
  }
  setText(lyricEl, txt);
}

// ── 进度：环 + 时间 ──
function syncProgress() {
  var audio = document.getElementById('audio');
  if (!audio) return;
  var p = audio.duration ? (audio.currentTime / audio.duration) : 0;
  p = p < 0 ? 0 : (p > 1 ? 1 : p);
  if (ringFill) {
    var R = 21, CIRC = 2 * Math.PI * R;
    ringFill.style.strokeDasharray = CIRC;
    ringFill.style.strokeDashoffset = CIRC * (1 - p);
  }
  curEl.textContent = fmtTime(audio.currentTime);
  totalEl.textContent = fmtTime(audio.duration);
}
function fmtTime(s) {
  if (!s || !isFinite(s)) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

// ── 背景动效：B 色带流动（CSS 动画，strip 上挂 data-bg="flow"）──
strip.setAttribute('data-bg', 'flow');
// ── 统一刷新 ──
function refresh() { syncTrack(); syncPlay(); syncVol(); syncProgress(); syncLyric(); }
// ── 封面环 seek（2026-10-21）：点/拖环 → audio.currentTime；环上浮时刻 ──
var stripCoverEl = document.getElementById('stripCover');
var ringFillEl = document.querySelector('.strip-ring-fill');
var curEl2 = document.getElementById('stripCur');
if (stripCoverEl) {
  stripCoverEl.addEventListener('pointerdown', function (e) {
    var a = document.getElementById('audio');
    if (!a || !a.duration) return;
    e.preventDefault();
    stripCoverEl.setPointerCapture(e.pointerId);
    strip.classList.add('seeking');
    function seekTo(x, y) {
      var r = stripCoverEl.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var ang = Math.atan2(y - cy, x - cx) + Math.PI / 2;
      if (ang < 0) ang += Math.PI * 2;
      var t = ang / (Math.PI * 2);
      a.currentTime = t * a.duration;
      syncProgress();
    }
    function onMove(ev) { seekTo(ev.clientX, ev.clientY); }
    function onUp() {
      stripCoverEl.removeEventListener('pointermove', onMove);
      stripCoverEl.removeEventListener('pointerup', onUp);
      strip.classList.remove('seeking');
    }
    stripCoverEl.addEventListener('pointermove', onMove);
    stripCoverEl.addEventListener('pointerup', onUp);
    seekTo(e.clientX, e.clientY);
  });
}

// ── 触屏/点按唤醒（2026-10-21）：点条身空白或封面 → 醒控件；点条外收起 ──
function wake() { strip.classList.add('showing'); }
function sleep() { strip.classList.remove('showing'); }
strip.addEventListener('click', function (e) {
  if (e.target === strip || e.target.classList.contains('strip-identity') ||
      e.target.classList.contains('strip-lyric') || e.target.classList.contains('strip-time') ||
      e.target === stripCoverEl) {
    wake();
  }
});
document.addEventListener('click', function (e) {
  if (!strip.contains(e.target)) sleep();
});

// ── 订阅播放/时间/音量事件 ──
var audio = document.getElementById('audio');
if (audio) {
  audio.addEventListener('play', function () { syncPlay(); });
  audio.addEventListener('pause', function () { syncPlay(); });
  audio.addEventListener('timeupdate', function () { syncProgress(); });
  audio.addEventListener('volumechange', function () { syncVol(); });
  audio.addEventListener('loadedmetadata', function () { syncProgress(); });
}

// ── 竖卡 DOM 变化 → 同步横条 ──
var mo2 = new MutationObserver(function () { syncTrack(); syncLyric(); });
var npc = document.getElementById('npCover');
if (npc) mo2.observe(npc, { childList: true });
var tnm = document.getElementById('trackName');
if (tnm) mo2.observe(tnm, { childList: true });
var tmm = document.getElementById('trackMode');
if (tmm) mo2.observe(tmm, { childList: true });
var fvb = document.getElementById('favBtn');
if (fvb) mo2.observe(fvb, { attributes: true, attributeFilter: ['class', 'style'] });
// 布局切换时全量刷新
var mo3 = new MutationObserver(function () { refresh(); syncStripHeight(); reportInteractiveRegions(); });
if (player) mo3.observe(player, { attributes: true, attributeFilter: ['data-layout'] });

refresh();
document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
})();
</script>

<script>

'use strict';
/* PV 引擎 · 00 层模型与注册表
 * ------------------------------------------------------------------
 * 一个 cut = layout + enter + hold + exit + decor*n + treatment*n + camera + transition
 * 每一层都是独立抽签的部件槽；部件只注册、不改核心。
 * 加一个新手法 = 在 pv/src 里加一个文件、写一次 PV.reg(...)，跑一次 build。
 * 契约详见 pv/README.md
 */
(function () {
  'use strict';
  var PV = window.PV || (window.PV = {});

  var GROUPS = ['mood', 'style', 'face', 'look', 'bg', 'layout', 'enter', 'hold', 'exit', 'decor', 'treatment', 'camera', 'transition'];
  var reg = {}, order = {};
  GROUPS.forEach(function (g) { reg[g] = {}; order[g] = []; });

  PV.GROUPS = GROUPS;

  PV.reg = function (group, key, def) {
    if (!reg[group]) throw new Error('PV.reg: 未知层 ' + group);
    if (reg[group][key]) throw new Error('PV.reg: 重复注册 ' + group + '/' + key);
    def = def || {};
    def.key = key; def.group = group;
    def.nm = def.nm || key;
    def.tags = def.tags || [];
    def.w = def.w == null ? 1 : def.w;
    reg[group][key] = def;
    if (order[group].indexOf(key) < 0) order[group].push(key);
    return def;
  };
  PV.part = function (group, key) { return reg[group][key] || null; };
  PV.parts = function (group) { return order[group].map(function (k) { return reg[group][k]; }); };
  PV.stats = function () {
    var o = {};
    GROUPS.forEach(function (g) { o[g] = order[g].length; });
    return o;

  var _seed = 1;
  PV.seed = function (v) { _seed = (v >>> 0) || 1; };
  /* 取当前种子：报告类工具要“量完再恢复原状”，没这个口子就只能弄脏随机流*/
  PV.seedValue = function () { return _seed; };
  PV.getSeed = function () { return _seed; };
  PV.rnd = function (a) {
    _seed = (_seed * 1664525 + 1013904223) >>> 0;
    return (_seed / 4294967296) * (a == null ? 1 : a);

    var p = PV.pick(arr), g = 0;
    while (arr.length > 1 && last && p.key === last && g++ < (tries || 8)) p = PV.pick(arr);

     之前只要句中有 2 个以上拉丁字母就整句按空格切，导致中文被整块处理——
     既没法在语言边界断行，逐字进场也退化成整句一起动。 */
  var RE_CJK_G = /[\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF]/;
